function safeLS(key, fallback) {
  try {
    if (typeof localStorage === 'undefined') return fallback;
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (_) { return fallback; }
}
function saveLS(key, val) {
  try { if (typeof localStorage !== 'undefined') localStorage.setItem(key, JSON.stringify(val)); } catch (_) {}
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function avImg(who, cls, st) {
  const av = (typeof window !== 'undefined' && window.TGT_AVATARS) ? window.TGT_AVATARS : {};
  const src = (who === 'p' ? av.priyanka : av.manju) || '';
  const alt = who === 'p' ? 'प्रियंका' : 'मंजू';
  return '<img class="' + (cls || 'av-xs') + '" src="' + src + '" alt="' + alt + '"' + (st ? ' style="' + st + '"' : '') + '>';
}

// Chapter Store (Bundle + LocalStorage imported JSONs)
const CHAPTER_BANK = {};
function normalizeRawChapter(data) {
  if (!data || !data.id || !data.title || !Array.isArray(data.questions) || !data.questions.length) {
    throw new Error('अमान्य पाठ फ़ाइल: id, title या questions गायब हैं।');
  }
  const qs = data.questions.map((q, idx) => {
    if (!Array.isArray(q.opts) || q.opts.length !== 4 || typeof q.ans !== 'number') {
      throw new Error('सवाल #' + (idx + 1) + ' में 4 विकल्प और ans होना आवश्यक है।');
    }
    let rawQ = String(q.q || '').trim();
    let stem = rawQ, src = q.src ? String(q.src) : '';
    if (!src) {
      const m = rawQ.match(/\s*\[((?:किताब|PYQ)[^\]]*)\]\s*$/);
      if (m) { stem = rawQ.slice(0, m.index).trim(); src = '(' + m[1].trim() + ')'; }
      else { src = '(किताब: ' + String(data.pages || '') + ')'; }
    }
    const cleanExp = String(q.exp || '')
      .replace(/\u26a0\ufe0f?\s*\u0915\u093f\u0924\u093e\u092c \u0938\u0941\u0927\u093e\u0930\s*:?|\u0915\u093f\u0924\u093e\u092c \u0938\u0941\u0927\u093e\u0930\s*:?/g, 'सटीक तथ्य:')
      .replace(/\u092f\u0939 \u092e\u092e\u094d\u092e\u0940 \u0915\u0940 \u0905\u092a\u0928\u0940\s+/g, 'यह अपनी ')
      .replace(/\u092e\u092e\u094d\u092e\u0940,\s*\u0907\u0928 \u0924\u0940\u0928\u094b\u0902/g, 'इन तीनों')
      .replace(/\u092e\u092e\u094d\u092e\u0940 \u0915\u094b \u0938\u094d\u092a\u0937\u094d\u091f \u0909\u0924\u094d\u0924\u0930 \u0938\u093f\u0916\u093e\u0928\u0947 \u0939\u0947\u0924\u0941\s+/g, 'स्पष्ट उत्तर हेतु ')
      .replace(/\u26a0\ufe0f?/g, '').trim();
    return {
      id: q.id != null ? q.id : idx + 1,
      type: q.type || 'BOOK',
      fmt: q.fmt || 'Direct',
      q: stem,
      src: src,
      opts: q.opts.map(String),
      ans: q.ans,
      exp: cleanExp,
      trick: String(q.trick || '').replace(/\u26a0\ufe0f?/g, '').trim(),
      vip: !!q.vip,
      match: Array.isArray(q.match) && q.match.length ? q.match : null
    };
  });
  return {
    id: String(data.id),
    num: Number(data.num || 0),
    subject: String(data.subject || ''),
    chapter_code: String(data.chapter_code || ''),
    title: String(data.title).trim(),
    pages: String(data.pages || ''),
    total_questions: qs.length,
    questions: qs
  };
}

function initChapterStore() {
  const b = (typeof window !== 'undefined' && window.TGT_CHAPTERS) ? window.TGT_CHAPTERS : {};
  Object.keys(b).forEach(k => { try { CHAPTER_BANK[k] = normalizeRawChapter(b[k]); } catch (_) {} });
  const extra = safeLS('tgt_gk_extra_chapters_v1', {});
  Object.keys(extra).forEach(k => { try { CHAPTER_BANK[k] = normalizeRawChapter(extra[k]); } catch (_) {} });
  attachChaptersToRoadmap();
}

function normTitle(t) {
  return String(t || '').replace(/\s+/g, '').replace(/[()\-–।]/g, '').toLowerCase();
}
function subjectIdFromText(subj) {
  const s = String(subj || '');
  if (s.includes('पर्यावरण')) return 'env';
  if (s.includes('राज') || s.includes('संविधान')) return 'pol';
  if (s.includes('इतिहास')) return 'his';
  if (s.includes('भूगोल') || s.includes('जनगणना')) return 'geo';
  if (s.includes('अर्थ')) return 'eco';
  if (s.includes('विज्ञान') || s.includes('स्वास्थ्य')) return 'sci';
  if (s.includes('संस्कृति') || s.includes('स्टैटिक')) return 'sta';
  return 'up';
}

function attachChaptersToRoadmap() {
  ROADMAP.forEach(s => s.chapters.forEach(c => { if (!c._baseChId) c._baseChId = c.chId || ''; c.liveId = ''; }));
  Object.values(CHAPTER_BANK).forEach(ch => {
    let matched = null;
    for (const s of ROADMAP) {
      for (const c of s.chapters) {
        if ((c._baseChId && c._baseChId === ch.id) || normTitle(c.t) === normTitle(ch.title)) {
          matched = c; break;
        }
      }
      if (matched) break;
    }
    if (matched) {
      matched.liveId = ch.id;
      matched.q = ch.total_questions;
      if (ch.pages) matched.p = ch.pages.replace(/\s*\(PDF[^)]*\)/g, '').trim();
    } else {
      const sid = subjectIdFromText(ch.subject);
      const sub = ROADMAP.find(s => s.id === sid) || ROADMAP[6];
      sub.chapters.push({ t: ch.title, p: ch.pages || 'नया पाठ', est: ch.total_questions, q: ch.total_questions, exam: 'both', liveId: ch.id, _baseChId: ch.id });
    }
  });
}

function importChapterData(rawJson) {
  const ch = normalizeRawChapter(rawJson);
  CHAPTER_BANK[ch.id] = ch;
  const extra = safeLS('tgt_gk_extra_chapters_v1', {});
  extra[ch.id] = ch;
  saveLS('tgt_gk_extra_chapters_v1', extra);
  attachChaptersToRoadmap();
  showToast('✅ नया पाठ जुड़ा: ' + ch.title + ' (' + ch.total_questions + ' सवाल)');
  return ch;
}

// Global permanent zoom helpers (100% = 20px default matching phone screenshot)
function loadGlobalZoom() {
  const raw = safeLS('tgt_gk_zoom_pct_v1', null);
  const n = Number(raw);
  if (raw !== null && raw !== '' && Number.isFinite(n) && n >= 75 && n <= 150) {
    return Math.round(n);
  }
  return 100;
}
function saveGlobalZoom(val) {
  const n = Number(val);
  const v = Math.max(75, Math.min(150, Math.round(Number.isFinite(n) ? n : 100)));
  app.zoomPct = v;
  app.userData.zoomPct = v;
  saveLS('tgt_gk_zoom_pct_v1', v);
  saveUserData(app.userId, app.userData);
  return v;
}
function zPx(basePx) {
  return (Math.round(basePx * ((app.zoomPct || 100) / 100) * 10) / 10) + 'px';
}

function getChProg(chId) {
  if (!app.userData.progress[chId]) {
    app.userData.progress[chId] = { answers: {}, stars: {}, curIdx: 0, finished: false };
  }
  return app.userData.progress[chId];
}

function getUserStats(uid) {
  const ud = uid === app.userId ? app.userData : loadUserData(uid);
  let doneCh = 0, seen = 0, attempted = 0, ok = 0;
  Object.keys(CHAPTER_BANK).forEach(cid => {
    const p = ud.progress[cid];
    if (!p) return;
    const ansMap = p.answers || {};
    const keys = Object.keys(ansMap);
    if (keys.length >= CHAPTER_BANK[cid].questions.length || p.finished) doneCh++;
    CHAPTER_BANK[cid].questions.forEach(q => {
      const val = ansMap[q.id];
      if (val !== undefined) {
        seen++;
        if (val >= 0) {
          attempted++;
          if (val === q.ans) ok++;
        }
      }
    });
  });
  const acc = attempted ? Math.round((ok / attempted) * 100) : 0;
  return { doneCh, seen, attempted, ok, acc };
}

function roadmapTotals() {
  let tot = 0, rdy = 0, qTot = 0;
  ROADMAP.forEach(s => s.chapters.forEach(c => {
    tot++;
    if (c.liveId && CHAPTER_BANK[c.liveId]) { rdy++; qTot += CHAPTER_BANK[c.liveId].total_questions; }
  }));
  return { tot, rdy, qTot };
}

function splitReadablePoints(rawExp) {
  const clean = String(rawExp || '')
    .replace(/\u26a0\ufe0f?\s*\u0915\u093f\u0924\u093e\u092c \u0938\u0941\u0927\u093e\u0930\s*:?|\u0915\u093f\u0924\u093e\u092c \u0938\u0941\u0927\u093e\u0930\s*:?/g, 'सटीक तथ्य:')
    .replace(/\u26a0\ufe0f?/g, '').trim();
  return clean
    .replace(/([।!])\s+/g, '$1\n')
    .replace(/;\s+/g, '\n')
    .replace(/सही मिलान:\s*/g, '\nसही मिलान: ')
    .split(/\n+/)
    .map(s => s.replace(/^[•\-]\s*/, '').trim())
    .filter(Boolean);
}

function highlightHindiFacts(rawStr) {
  const str = String(rawStr || '');
  const rx = /(^[^:\n]{3,36}:|'[^'\n]{2,45}'|"[^"\n]{2,45}"|अनुच्छेद\s*\d+[A-Za-z\u0900-\u097F\-]*|अनु\.\s*\d+[A-Za-z\u0900-\u097F\-]*|\d+\s*(?:लाख|मिलियन|करोड़|सीटें?|सीट|प्रतिशत|%|सदस्य|वर्ष|साल|दिन|माह|वाँ|वें|वीं)|\d{1,2}\s*(?:जनवरी|फरवरी|मार्च|अप्रैल|मई|जून|जुलाई|अगस्त|सितंबर|अक्टूबर|नवंबर|दिसंबर)|(?:1[789]\d{2}|20\d{2}))/g;
  let out = '', last = 0, m;
  while ((m = rx.exec(str)) !== null) {
    if (m.index > last) out += esc(str.slice(last, m.index));
    out += '<b class="kh">' + esc(m[0]) + '</b>';
    last = rx.lastIndex;
    if (m[0].length === 0) rx.lastIndex++;
  }
  if (last < str.length) out += esc(str.slice(last));
  return out;
}

function extractPageLabel(q, ch) {
  const s = String((q && q.src) || '');
  const m = s.match(/प\.\s*([0-9\u0966-\u096F\u2013\-, ]+)/);
  if (m && m[1].trim()) return 'पन्ना ' + m[1].trim().replace(/[,\s]+$/, '');
  if (s.includes('किताब में नहीं')) return 'व्याख्या';
  const cp = ch && ch.pages ? String(ch.pages).replace(/\s*\(PDF[^)]*\)/g, '').replace(/^प\.\s*/, '').trim() : '';
  return cp ? 'पन्ना ' + cp : 'व्याख्या';
}

function buildExpTimeline(rawExp) {
  const parts = splitReadablePoints(rawExp);
  const lead = parts.length ? parts[0] : '';
  const points = parts.slice(1);
  return { lead, points };
}

function calcMarks(right, wrong, total, mode) {
  if (mode === 'up') return { big: (right * 3 - wrong) + ' / ' + (total * 3) + ' अंक', sub: 'UP TGT (+3 / −1) · ' + right + '×3 − ' + wrong + '×1' };
  if (mode === 'delhi') return { big: (right - wrong * 0.25) + ' / ' + total + ' अंक', sub: 'दिल्ली (+1 / −0.25) · ' + right + ' − ' + (wrong * 0.25) };
  const pct = total ? Math.round((right / total) * 100) : 0;
  return { big: right + ' / ' + total + ' सही', sub: pct + '% सटीकता · शानदार अभ्यास!' };
}

function duelPid() {
  if (app.duel.pid) return app.duel.pid;
  let id = safeLS('tgt_gk_duel_pid_v2', '');
  if (!id || typeof id !== 'string') {
    id = 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
    saveLS('tgt_gk_duel_pid_v2', id);
  }
  app.duel.pid = id;
  return id;
}

function defaultPlayerName() {
  const saved = safeLS('tgt_gk_duel_name_' + app.userId, '');
  if (saved && String(saved).trim()) return String(saved).trim().slice(0, 16);
  return app.userId === 'p' ? 'प्रियंका' : 'मंजू';
}

function duelPoolMax(scope) {
  if (scope === 'mix') {
    return Object.values(CHAPTER_BANK).reduce((a, c) => a + c.questions.length, 0);
  }
  return CHAPTER_BANK[scope] ? CHAPTER_BANK[scope].questions.length : 0;
}

function duelEffCount() {
  const mx = Math.max(1, duelPoolMax(app.duel.scope) || 30);
  if (app.duel.allScope) return mx;
  const n = Math.round(Number(app.duel.count) || 30);
  return Math.max(1, Math.min(mx, n));
}

function buildDuelRefs(scope, count) {
  let pool = [];
  if (scope === 'mix') {
    Object.keys(CHAPTER_BANK).forEach(cid => CHAPTER_BANK[cid].questions.forEach(q => {
      pool.push({ chId: cid, qId: q.id });
    }));
  } else if (CHAPTER_BANK[scope]) {
    pool = CHAPTER_BANK[scope].questions.map(q => ({ chId: scope, qId: q.id }));
  }
  const arr = pool.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  const want = Math.max(1, Math.min(Number(count) || 30, arr.length));
  return arr.slice(0, want);
}

function buildDuelPool(scope, count) {
  return buildDuelRefs(scope, count).map(r => {
    const ch = CHAPTER_BANK[r.chId];
    return ch ? ch.questions.find(q => q.id === r.qId) : null;
  }).filter(Boolean);
}

function resolveDuelQuestions(qRefs) {
  const list = Array.isArray(qRefs) ? qRefs : Object.values(qRefs || {});
  return list.map(r => {
    const ch = r && CHAPTER_BANK[r.chId];
    if (!ch) return null;
    const found = ch.questions.find(q => q.id === r.qId);
    return found ? Object.assign({ _chId: r.chId }, found) : null;
  }).filter(Boolean);
}

function serverNow() {
  return Date.now() + (app.duel.serverOffset || 0);
}

function fmtDuelClock(ms) {
  const s = Math.max(0, Math.floor((ms || 0) / 1000));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
}

function fmtDuelDur(ms) {
  if (!ms || ms <= 0) return '—';
  const totTenths = Math.round(ms / 100);
  const s = totTenths / 10;
  if (s < 60) return s.toFixed(1) + 's';
  const m = Math.floor(s / 60);
  const rem = (s - m * 60).toFixed(0).padStart(2, '0');
  return m + ':' + rem;
}

function fbUrl(subPath) {
  const base = String(FIREBASE_DB_URL || '').replace(/\/+$/, '');
  return base + (subPath ? '/' + subPath.replace(/^\/+/, '') : '') + '.json';
}

async function fbReq(subPath, method, bodyObj, keepalive) {
  if (!FIREBASE_DB_URL || typeof fetch !== 'function') return null;
  try {
    const opts = { method: method || 'GET' };
    if (keepalive) opts.keepalive = true;
    if (bodyObj !== undefined) {
      opts.headers = { 'Content-Type': 'application/json' };
      opts.body = JSON.stringify(bodyObj);
    }
    const resp = await fetch(fbUrl(subPath), opts);
    if (!resp.ok) {
      app.duel.netOk = false;
      return null;
    }
    app.duel.netOk = true;
    const txt = await resp.text();
    return txt ? JSON.parse(txt) : null;
  } catch (_) {
    app.duel.netOk = false;
    return null;
  }
}

async function sendPresence(isOnline, keepalive) {
  if (!FIREBASE_DB_URL || app.view === 'welcome') return null;
  const uid = app.userId === 'p' ? 'p' : 'm';
  const t0 = Date.now();
  const res = await fbReq('presence/' + uid, 'PUT', {
    ts: { '.sv': 'timestamp' },
    online: isOnline !== false,
    pid: duelPid()
  }, keepalive);
  const t1 = Date.now();
  if (res && typeof res.ts === 'number') {
    app.duel.serverOffset = res.ts - Math.round((t0 + t1) / 2);
  }
  return res;
}

function setNestedAt(obj, pathStr, val) {
  const ks = String(pathStr || '').split('/').filter(Boolean);
  if (!ks.length) return val;
  const root = (obj && typeof obj === 'object') ? obj : {};
  let cur = root;
  for (let i = 0; i < ks.length - 1; i++) {
    if (!cur[ks[i]] || typeof cur[ks[i]] !== 'object') cur[ks[i]] = {};
    cur = cur[ks[i]];
  }
  if (val === null) delete cur[ks[ks.length - 1]];
  else cur[ks[ks.length - 1]] = val;
  return root;
}

function duelPlayers() {
  const p = (app.duel.room && app.duel.room.p) || {};
  return Object.keys(p)
    .filter(id => p[id] && typeof p[id] === 'object')
    .map(id => Object.assign({ id }, p[id]))
    .sort((a, b) => (a.role === 'host' ? 0 : 1) - (b.role === 'host' ? 0 : 1));
}

function duelMePlayer() {
  const pid = duelPid();
  return duelPlayers().find(x => x.id === pid) || null;
}

function duelOppPlayer() {
  const pid = duelPid();
  return duelPlayers().find(x => x.id !== pid) || null;
}

function isDuelHost() {
  const m = duelMePlayer();
  return !!(m && m.role === 'host');
}

function calcMyDuelStats() {
  const d = app.duel;
  let ok = 0, wr = 0, sk = 0, k = 0;
  d.qs.forEach((q, idx) => {
    const a = d.myAns[idx];
    if (a === undefined) return;
    k++;
    if (a === -1) sk++;
    else if (a === q.ans) ok++;
    else wr++;
  });
  const pts = ok * 3 - wr * 1;
  return { k, ok, wr, sk, pts };
}

function playerAvatarHtml(pObj, cls) {
  const nm = String((pObj && pObj.name) || '').trim();
  const who = pObj && pObj.who;
  if (nm === 'मंजू' || (who === 'm' && (!nm || nm === 'मंजू'))) return avImg('m', cls || 'av-xs');
  if (nm === 'प्रियंका' || (who === 'p' && (!nm || nm === 'प्रियंका'))) return avImg('p', cls || 'av-xs');
  const ch = nm ? Array.from(nm)[0].toUpperCase() : '?';
  return '<span class="bav-init">' + esc(ch) + '</span>';
}

function renderBattleBoxesHtml() {
  const d = app.duel;
  const n = Math.max(1, d.qs.length || 30);
  const myS = calcMyDuelStats();
  const meP = duelMePlayer() || { name: d.customName || defaultPlayerName(), who: app.userId };
  const opP = duelOppPlayer();
  const box = (pObj, pts, k, isYou, isFin) =>
    '<div class="bbox">' +
      '<div class="bname">' +
        playerAvatarHtml(pObj, 'av-xs') +
        '<b>' + esc((pObj && pObj.name) || 'खिलाड़ी') + '</b>' +
        (isYou ? '<span class="byou">YOU</span>' : '') +
        (isFin ? '<span class="bfin">✓ पूरा</span>' : '') +
      '</div>' +
      '<div class="bpts">' +
        '<b class="tnum">' + pts + '</b><span>अंक</span>' +
        '<span class="bk-cnt tnum">' + k + '/' + n + '</span>' +
      '</div>' +
      '<div class="bbar"><i style="width:' + Math.min(100, Math.round((k / n) * 100)) + '%"></i></div>' +
    '</div>';

  const rightBox = opP
    ? box(opP, Number(opP.pts || 0), Number(opP.k || 0), false, !!opP.fin)
    : '<div class="bbox" style="display:flex;flex-direction:column;justify-content:center;align-items:center;color:#78716C;font-size:11.5px;font-weight:700;text-align:center;">' +
        (d.soloPractice ? '⚡ अकेला अभ्यास मोड' : 'दोस्त जुड़ने का इंतज़ार…') +
      '</div>';

  return box(meP, myS.pts, myS.k, true, !!d.fin) + '<div class="bvs">⚡</div>' + rightBox;
}

function updateLiveBattleDomOnly() {
  if (typeof document === 'undefined') return false;
  const root = document.getElementById('appRoot');
  const bEl = root && root.querySelector ? root.querySelector('#duelBattleBar') : null;
  if (!bEl) return false;
  bEl.innerHTML = renderBattleBoxesHtml();
  return true;
}

function hasIncomingChallenge() {
  if (app.view === 'welcome') return false;
  const d = app.duel;
  if (app.view === 'duel' && (d.stage === 'lobby' || d.stage === 'count' || d.stage === 'live')) return false;
  const inv = d.activeInvite;
  if (!inv || !inv.code || inv.status !== 'wait') return false;
  if (inv.fromPid && inv.fromPid === duelPid()) return false;
  if (inv.code === d.code || inv.code === d.lastRejectedId) return false;
  if (typeof inv.createdAt === 'number' && (serverNow() - inv.createdAt) > 180000) return false;
  return true;
}

function hasFocusedInputInRoot() {
  if (typeof document === 'undefined' || !document.activeElement) return false;
  const tag = String(document.activeElement.tagName || '').toUpperCase();
  if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') return false;
  const root = document.getElementById('appRoot');
  return !!(root && root.contains && root.contains(document.activeElement));
}

function startDuelStopwatch() {
  stopDuelTimer();
  if (typeof setInterval === 'function' && typeof window !== 'undefined' && !window.__DISABLE_TIMERS) {
    app.duel.timerId = setInterval(() => {
      const d = app.duel;
      if (app.view !== 'duel' || d.stage !== 'live') return;
      d.elapsedMs = Math.max(0, Date.now() - (d.startedAt || Date.now()));
      if (typeof document !== 'undefined') {
        const root = document.getElementById('appRoot');
        const clk = root && root.querySelector ? root.querySelector('#duelClkEl') : null;
        if (clk) clk.textContent = fmtDuelClock(d.elapsedMs);
      }
    }, 500);
  }
}

function runDuelCountdown() {
  const d = app.duel;
  const goAt = (d.room && d.room.go) ? Number(d.room.go) : (serverNow() + 3000);
  if (typeof window === 'undefined' || window.__DISABLE_TIMERS) {
    beginDuelLivePlay();
    return;
  }
  const tick = () => {
    if (d.stage !== 'count') return;
    const left = goAt - serverNow();
    if (typeof document !== 'undefined') {
      const root = document.getElementById('appRoot');
      const el = root && root.querySelector ? root.querySelector('#duelCountNum') : null;
      if (el) el.textContent = left > 2000 ? '3' : (left > 1000 ? '2' : (left > 0 ? '1' : 'GO!'));
    }
    if (left <= 0) {
      beginDuelLivePlay();
      return;
    }
    setTimeout(tick, 60);
  };
  tick();
}

function beginDuelLivePlay() {
  const d = app.duel;
  const r = d.room;
  const refs = (r && r.qRefs) ? r.qRefs : d.qRefs;
  const qs = resolveDuelQuestions(refs);
  if (qs.length) d.qs = qs;
  if (!d.qs.length) {
    d.qs = buildDuelPool(d.scope, duelEffCount());
  }
  d.round = (r && r.round) ? Number(r.round) : d.round;
  d.qIdx = 0;
  d.myAns = {};
  d.startedAt = Date.now();
  d.elapsedMs = 0;
  d.finishedMs = 0;
  d.fin = 0;
  d.palOpen = false;
  d.palFilter = 'all';
  d.leaveOpen = false;
  d.resOpenIdx = null;
  d.stage = 'live';
  app.view = 'duel';
  startDuelStopwatch();
  render();
  pushMyDuelProgress(false);
}

function onDuelRoomUpdate() {
  const d = app.duel;
  const r = d.room;
  if (!r) {
    if (d.stage === 'lobby' || d.stage === 'count') {
      stopDuelRoomStream();
      d.stage = 'menu';
      d.code = '';
      showToast('Room बंद हो गया है');
    }
    return;
  }
  if (r.scope) d.scope = r.scope;
  if (r.count) d.count = Number(r.count);

  if (r.st === 'go' && d.stage === 'lobby') {
    d.round = Number(r.round || 0);
    d.stage = 'count';
    app.view = 'duel';
    render();
    runDuelCountdown();
    return;
  }
  if (r.st === 'wait' && d.stage === 'result' && Number(r.round || 0) !== Number(d.round || 0)) {
    d.round = Number(r.round || 0);
    d.myAns = {};
    d.fin = 0;
    d.stage = 'lobby';
    if (r.qRefs) d.qs = resolveDuelQuestions(r.qRefs);
    render();
    showToast('⚔️ नया राउंड तैयार है!');
    return;
  }
  if (app.view === 'duel') {
    if (d.stage === 'live') {
      updateLiveBattleDomOnly();
    } else if (d.stage === 'lobby' || d.stage === 'result') {
      if (!hasFocusedInputInRoot()) render();
    }
  }
}

function listenDuelRoom(code) {
  stopDuelRoomStream();
  if (!FIREBASE_DB_URL || !code) return;
  if (typeof EventSource === 'function' && (typeof window === 'undefined' || !window.__DISABLE_TIMERS)) {
    try {
      const es = new EventSource(fbUrl('rooms/' + code));
      app.duel.es = es;
      es.addEventListener('put', (e) => {
        try {
          const m = JSON.parse(e.data);
          app.duel.room = setNestedAt(app.duel.room, m.path, m.data);
          onDuelRoomUpdate();
        } catch (_) {}
      });
      es.addEventListener('patch', (e) => {
        try {
          const m = JSON.parse(e.data);
          const base = m.path === '/' ? '' : m.path;
          Object.keys(m.data || {}).forEach(k => {
            app.duel.room = setNestedAt(app.duel.room, base + '/' + k, m.data[k]);
          });
          onDuelRoomUpdate();
        } catch (_) {}
      });
    } catch (_) {}
  }
  if (typeof setInterval === 'function' && (typeof window === 'undefined' || !window.__DISABLE_TIMERS)) {
    app.duel.roomPollId = setInterval(async () => {
      if (!app.duel.code) return;
      const snap = await fbReq('rooms/' + app.duel.code, 'GET');
      if (snap !== null || !app.duel.netOk) {
        app.duel.room = snap;
        onDuelRoomUpdate();
      }
    }, 1150);
  }
}

function applyRemoteState(data) {
  const d = app.duel;
  const opId = app.userId === 'p' ? 'm' : 'p';
  const prevOnline = d.opOnline;
  const prevPopup = hasIncomingChallenge();
  const prevInvSig = d.activeInvite ? (d.activeInvite.code + ':' + d.activeInvite.status + ':' + d.activeInvite.count) : '';

  const pres = data && data.presence ? data.presence : null;
  d.remotePresence = pres;
  const opP = pres ? pres[opId] : null;
  d.opOnline = !!(opP && opP.online !== false && typeof opP.ts === 'number' && (serverNow() - opP.ts) < 18000);

  d.activeInvite = data && data.activeInvite ? data.activeInvite : null;
  const nextInvSig = d.activeInvite ? (d.activeInvite.code + ':' + d.activeInvite.status + ':' + d.activeInvite.count) : '';

  const nextPopup = hasIncomingChallenge();
  if ((prevOnline !== d.opOnline || prevPopup !== nextPopup || prevInvSig !== nextInvSig) && !hasFocusedInputInRoot()) {
    if (app.view === 'duel' && d.stage === 'live' && !nextPopup) {
      updateLiveBattleDomOnly();
    } else {
      render();
    }
  }
}

async function syncLiveState() {
  if (!FIREBASE_DB_URL) return null;
  const [pres, inv] = await Promise.all([
    fbReq('presence', 'GET'),
    fbReq('activeInvite', 'GET')
  ]);
  applyRemoteState({ presence: pres, activeInvite: inv });
  if (app.duel.code && (typeof window !== 'undefined' && window.__DISABLE_TIMERS)) {
    const rSnap = await fbReq('rooms/' + app.duel.code, 'GET');
    if (rSnap) {
      app.duel.room = rSnap;
      onDuelRoomUpdate();
    }
  }
  return { presence: pres, activeInvite: inv };
}

function readAndSaveDuelName() {
  if (typeof document !== 'undefined') {
    const inp = document.getElementById('duelNameInp');
    if (inp && typeof inp.value === 'string' && inp.value.trim()) {
      app.duel.customName = inp.value.trim().slice(0, 16);
    }
  }
  const nm = (app.duel.customName || defaultPlayerName()).trim().slice(0, 16);
  app.duel.customName = nm;
  saveLS('tgt_gk_duel_name_' + app.userId, nm);
  return nm;
}

async function createDuelRoom(soloDirect) {
  if (app.duel.submitting) return null;
  const d = app.duel;
  const nm = readAndSaveDuelName();
  const cnt = duelEffCount();
  const qRefs = buildDuelRefs(d.scope, cnt);
  if (!qRefs.length) { showToast('इस पाठ में सवाल उपलब्ध नहीं हैं'); return null; }

  const scopeTitle = d.scope === 'mix' ? 'सभी मिक्स सवाल' : (CHAPTER_BANK[d.scope]?.title || 'पाठ');
  d.qRefs = qRefs;
  d.qs = resolveDuelQuestions(qRefs);
  d.count = qRefs.length;
  d.err = '';

  if (soloDirect) {
    d.soloPractice = true;
    d.code = '';
    d.room = {
      v: 2, st: 'go', round: 0, scope: d.scope, scopeTitle, count: qRefs.length, qRefs,
      p: { [duelPid()]: { name: nm, who: app.userId, role: 'host', pts: 0, k: 0, ok: 0, wr: 0, sk: 0, fin: 0, ans: {} } }
    };
    beginDuelLivePlay();
    return d.room;
  }

  d.soloPractice = false;
  d.submitting = true;
  render();

  const pid = duelPid();
  let code = '';
  for (let t = 0; t < 8; t++) {
    const c = String(1000 + Math.floor(Math.random() * 9000));
    const ex = await fbReq('rooms/' + c, 'GET');
    if (!ex || !ex.exp || ex.exp < Date.now()) { code = c; break; }
  }
  if (!code) code = String(1000 + Math.floor(Math.random() * 9000));

  const roomObj = {
    v: 2,
    code,
    exp: Date.now() + 3 * 3600 * 1000,
    st: 'wait',
    round: 0,
    scope: d.scope,
    scopeTitle,
    count: qRefs.length,
    createdAt: { '.sv': 'timestamp' },
    qRefs,
    p: {
      [pid]: { name: nm, who: app.userId, role: 'host', pts: 0, k: 0, ok: 0, wr: 0, sk: 0, fin: 0, ans: {} }
    }
  };

  const res = await fbReq('rooms/' + code, 'PUT', roomObj);
  d.submitting = false;
  if (!res) {
    d.err = 'Room नहीं बन सका — इंटरनेट चालू करें (या नीचे "अकेले प्रैक्टिस" दबाएँ)';
    render();
    return null;
  }

  await fbReq('activeInvite', 'PUT', {
    code,
    status: 'wait',
    fromPid: pid,
    fromWho: app.userId,
    fromName: nm,
    scope: d.scope,
    scopeTitle,
    count: qRefs.length,
    createdAt: { '.sv': 'timestamp' }
  });

  d.code = code;
  d.round = 0;
  d.room = res;
  d.stage = 'lobby';
  app.view = 'duel';
  listenDuelRoom(code);
  render();
  return res;
}

async function updateHostLobbySetup() {
  const d = app.duel;
  if (!d.code || !isDuelHost() || !d.room || d.room.st !== 'wait') return;
  const cnt = duelEffCount();
  const qRefs = buildDuelRefs(d.scope, cnt);
  const scopeTitle = d.scope === 'mix' ? 'सभी मिक्स सवाल' : (CHAPTER_BANK[d.scope]?.title || 'पाठ');
  d.qRefs = qRefs;
  d.qs = resolveDuelQuestions(qRefs);
  d.count = qRefs.length;
  d.room.scope = d.scope;
  d.room.scopeTitle = scopeTitle;
  d.room.count = qRefs.length;
  d.room.qRefs = qRefs;
  render();
  await fbReq('rooms/' + d.code, 'PATCH', { scope: d.scope, scopeTitle, count: qRefs.length, qRefs });
  await fbReq('activeInvite', 'PATCH', { scope: d.scope, scopeTitle, count: qRefs.length });
}

async function joinDuelRoom(explicitCode) {
  if (app.duel.submitting) return null;
  const d = app.duel;
  const nm = readAndSaveDuelName();
  let rawCode = explicitCode || '';
  if (!rawCode && typeof document !== 'undefined') {
    const cInp = document.getElementById('duelCodeInp');
    if (cInp && cInp.value) rawCode = cInp.value;
  }
  if (!rawCode) rawCode = d.prefillCode || '';
  const code = String(rawCode).replace(/\D/g, '').slice(0, 4);
  if (code.length !== 4) {
    d.err = '4 अंक का सही Room Code डालें!';
    render();
    return null;
  }

  d.err = '';
  d.submitting = true;
  render();

  const r = await fbReq('rooms/' + code, 'GET');
  d.submitting = false;
  if (!r || (r.exp && r.exp < Date.now())) {
    d.err = 'कोड ' + code + ' वाला कोई चालू Room नहीं मिला!';
    render();
    return null;
  }

  const pid = duelPid();
  const existingPlayers = Object.keys(r.p || {});
  const alreadyIn = existingPlayers.includes(pid);
  if (!alreadyIn && existingPlayers.length >= 2) {
    d.err = 'यह Room पहले से भरा हुआ है (2/2 खिलाड़ी)।';
    render();
    return null;
  }

  const qs = resolveDuelQuestions(r.qRefs);
  if (!qs.length) {
    d.err = 'इस Room का पाठ इस फ़ोन में उपलब्ध नहीं है।';
    render();
    return null;
  }

  const role = alreadyIn ? ((r.p[pid] && r.p[pid].role) || 'guest') : 'guest';
  const myPlayerObj = alreadyIn && r.p[pid]
    ? Object.assign({}, r.p[pid], { name: nm, who: app.userId })
    : { name: nm, who: app.userId, role, pts: 0, k: 0, ok: 0, wr: 0, sk: 0, fin: 0, ans: {} };

  await fbReq('rooms/' + code + '/p/' + pid, 'PUT', myPlayerObj);
  if (!r.p) r.p = {};
  r.p[pid] = myPlayerObj;

  d.soloPractice = false;
  d.code = code;
  d.prefillCode = '';
  d.scope = r.scope || 'ch01';
  d.count = r.count || qs.length;
  d.round = Number(r.round || 0);
  d.qs = qs;
  d.qRefs = r.qRefs;
  d.room = r;
  app.view = 'duel';
  listenDuelRoom(code);

  await fbReq('activeInvite', 'PATCH', { status: 'joined' });

  if (r.st === 'go') {
    beginDuelLivePlay();
  } else {
    d.stage = 'lobby';
    render();
  }
  return r;
}

async function startDuelRoom(allowSingle) {
  const d = app.duel;
  if (!d.code || !d.room) return;
  const ps = duelPlayers();
  if (!allowSingle && ps.length < 2) {
    showToast('पहले दूसरे खिलाड़ी को जुड़ने दें (या "अकेले शुरू करें" दबाएँ)');
    return;
  }
  if (ps.length < 2) d.soloPractice = true;
  await sendPresence(true);
  const goTime = Math.round(serverNow() + 3200);
  d.room.st = 'go';
  d.room.go = goTime;
  d.stage = 'count';
  render();
  runDuelCountdown();
  await fbReq('rooms/' + d.code, 'PATCH', { st: 'go', go: goTime });
  await fbReq('activeInvite', 'PATCH', { status: 'started' });
}

async function pushMyDuelProgress(isFinished) {
  const d = app.duel;
  const s = calcMyDuelStats();
  const pid = duelPid();
  const payload = {
    name: d.customName || defaultPlayerName(),
    who: app.userId,
    pts: s.pts,
    k: s.k,
    ok: s.ok,
    wr: s.wr,
    sk: s.sk,
    ans: d.myAns
  };
  if (isFinished) {
    payload.fin = 1;
    payload.ms = d.finishedMs || d.elapsedMs || 0;
  }
  if (d.room && d.room.p && d.room.p[pid]) {
    Object.assign(d.room.p[pid], payload);
  }
  if (!d.code || d.soloPractice) return;
  await fbReq('rooms/' + d.code + '/p/' + pid, 'PATCH', payload);
}

async function handleDuelPick(idx) {
  const d = app.duel;
  if (d.stage !== 'live') return;
  const q = d.qs[d.qIdx];
  if (!q) return;
  if (d.myAns[d.qIdx] !== undefined) return;
  d.myAns[d.qIdx] = Number(idx);
  render();
  await pushMyDuelProgress(false);
}

async function handleDuelSkip() {
  const d = app.duel;
  if (d.stage !== 'live') return;
  const q = d.qs[d.qIdx];
  if (!q) return;
  if (d.myAns[d.qIdx] !== undefined) return;
  d.myAns[d.qIdx] = -1;
  showToast('⏭ नहीं आता (0 निगेटिव अंक) · नीचे सही उत्तर व व्याख्या देखें');
  await pushMyDuelProgress(false);
}

function stepDuel(delta, viaSwipe) {
  const d = app.duel;
  if (d.stage !== 'live') return;
  const nxt = d.qIdx + delta;
  if (nxt < 0) { showToast('यह पहला सवाल है'); return; }
  if (nxt >= d.qs.length) {
    showToast('यह आख़िरी सवाल है — "परिणाम देखें" दबाएँ');
    return;
  }
  d.qIdx = nxt;
  if (viaSwipe) {
    showToast(delta > 0 ? '👉 सवाल #' + (nxt + 1) : '👈 सवाल #' + (nxt + 1));
  } else {
    render();
  }
}

async function finishDuelRun() {
  const d = app.duel;
  stopDuelTimer();
  d.elapsedMs = Math.max(100, Date.now() - (d.startedAt || Date.now()));
  d.finishedMs = d.elapsedMs;
  d.fin = 1;
  d.palOpen = false;
  d.leaveOpen = false;
  d.stage = 'result';
  render();
  await pushMyDuelProgress(true);
}

async function rematchDuelRoom() {
  const d = app.duel;
  const cnt = duelEffCount();
  const qRefs = buildDuelRefs(d.scope, cnt);
  const scopeTitle = d.scope === 'mix' ? 'सभी मिक्स सवाल' : (CHAPTER_BANK[d.scope]?.title || 'पाठ');
  if (d.soloPractice || !d.code) {
    d.qRefs = qRefs;
    d.qs = resolveDuelQuestions(qRefs);
    beginDuelLivePlay();
    return;
  }
  const nextRound = Number((d.room && d.room.round) || 0) + 1;
  const upd = {
    st: 'wait',
    round: nextRound,
    go: null,
    scope: d.scope,
    scopeTitle,
    count: qRefs.length,
    qRefs
  };
  duelPlayers().forEach(p => {
    upd['p/' + p.id + '/pts'] = 0;
    upd['p/' + p.id + '/k'] = 0;
    upd['p/' + p.id + '/ok'] = 0;
    upd['p/' + p.id + '/wr'] = 0;
    upd['p/' + p.id + '/sk'] = 0;
    upd['p/' + p.id + '/fin'] = 0;
    upd['p/' + p.id + '/ms'] = null;
    upd['p/' + p.id + '/ans'] = null;
  });
  d.round = nextRound;
  d.qRefs = qRefs;
  d.qs = resolveDuelQuestions(qRefs);
  d.myAns = {};
  d.fin = 0;
  d.stage = 'lobby';
  if (d.room) {
    d.room.st = 'wait';
    d.room.round = nextRound;
    d.room.qRefs = qRefs;
    d.room.count = qRefs.length;
  }
  render();
  await fbReq('rooms/' + d.code, 'PATCH', upd);
}

async function leaveDuelRoom(goHome) {
  const d = app.duel;
  const code = d.code;
  const pid = duelPid();
  const host = isDuelHost();
  stopDuelTimer();
  stopDuelRoomStream();
  d.code = '';
  d.room = null;
  d.soloPractice = false;
  d.leaveOpen = false;
  d.palOpen = false;
  d.stage = 'menu';
  d.err = '';
  if (goHome) app.view = 'home';
  render();
  if (code) {
    if (host) {
      await fbReq('rooms/' + code, 'DELETE');
      if (d.activeInvite && d.activeInvite.code === code) {
        await fbReq('activeInvite', 'PATCH', { status: 'closed' });
      }
    } else {
      await fbReq('rooms/' + code + '/p/' + pid, 'DELETE');
    }
  }
}

function duelVerdict(myS, myMs, opP, isFinal) {
  if (!opP) return ['⚡ अभ्यास पूरा! (' + myS.pts + ' अंक)', 'win'];
  const n = Math.max(1, app.duel.qs.length || 30);
  if (!isFinal) return ['⏳ ' + (opP.name || 'दोस्त') + ' अभी खेल रही हैं… (' + (opP.k || 0) + '/' + n + ')', 'wait'];
  const mp = Number(myS.pts || 0), op = Number(opP.pts || 0);
  const myNm = app.duel.customName || defaultPlayerName();
  const opNm = opP.name || 'दोस्त';
  if (mp !== op) return mp > op ? ['🏆 ' + myNm + ' जीतीं!', 'win'] : ['🏆 ' + opNm + ' जीतीं — अगली बार पक्का! 💪', 'lose'];
  if (myMs && opP.ms && myMs !== opP.ms) {
    return myMs < opP.ms ? ['🏆 बराबर अंक — कम समय से ' + myNm + ' जीतीं!', 'win'] : ['🏆 बराबर अंक — कम समय से ' + opNm + ' जीतीं!', 'lose'];
  }
  return ['🤝 बराबरी का शानदार मुक़ाबला!', 'draw'];
}

function render() {
  const root = document.getElementById('appRoot');
  if (!root) return '';
  const oldBody = root.querySelector ? root.querySelector('.body-scr') : null;
  const oldHome = root.querySelector ? root.querySelector('.cm-scroll') : null;
  const prevBodyTop = oldBody ? oldBody.scrollTop : 0;
  const prevHomeTop = oldHome ? oldHome.scrollTop : 0;

  let renderKey = app.view;
  if (app.view === 'quiz') {
    const ch = CHAPTER_BANK[app.quiz.chId];
    const qId = app.quiz.qIds[app.quiz.cur];
    const p = ch ? getChProg(ch.id).answers[qId] : undefined;
    renderKey = 'quiz:' + app.quiz.chId + ':' + app.quiz.cur + ':' + (p !== undefined ? 'sol' : 'q');
  } else if (app.view === 'home') {
    renderKey = 'home:' + app.userData.tabId;
  } else if (app.view === 'duel') {
    renderKey = 'duel:' + app.duel.stage + ':' + app.duel.qIdx;
  }

  let html = '';
  if (app.view === 'welcome') html = renderWelcomeView();
  else if (app.view === 'home') html = renderHomeView();
  else if (app.view === 'quiz') html = renderQuizView();
  else if (app.view === 'result') html = renderResultView();
  else html = renderDuelView();
  const popupHtml = hasIncomingChallenge() ? renderIncomingModal(app.duel.activeInvite) : '';
  root.innerHTML = html + popupHtml + (app.toast ? '<div class="toast">' + esc(app.toast) + '</div>' : '');

  if (renderKey === app._lastRenderKey) {
    const newBody = root.querySelector ? root.querySelector('.body-scr') : null;
    const newHome = root.querySelector ? root.querySelector('.cm-scroll') : null;
    if (newBody) newBody.scrollTop = prevBodyTop;
    if (newHome) newHome.scrollTop = prevHomeTop;
  }
  app._lastRenderKey = renderKey;

  if ((app.view === 'quiz' || (app.view === 'duel' && app.duel.stage === 'live')) && root.querySelector) {
    const strip = root.querySelector('.q-strip');
    const active = strip && strip.querySelector ? strip.querySelector('.q-num.cur') : null;
    if (strip && active && typeof active.offsetLeft === 'number') {
      strip.scrollLeft = Math.max(0, active.offsetLeft - (strip.clientWidth || 0) / 2 + (active.offsetWidth || 0) / 2);
    }
  }
  return root.innerHTML;
}

function openChapter(chId, mode) {
  const ch = CHAPTER_BANK[chId];
  if (!ch) return;
  const prog = getChProg(chId);
  let ids = [];
  if (mode === 'wrong') ids = ch.questions.filter(q => prog.answers[q.id] !== undefined && prog.answers[q.id] >= 0 && prog.answers[q.id] !== q.ans).map(q => q.id);
  else if (mode === 'skip') ids = ch.questions.filter(q => prog.answers[q.id] === -1 || prog.answers[q.id] === undefined).map(q => q.id);
  else if (mode === 'star') ids = ch.questions.filter(q => prog.stars && prog.stars[q.id]).map(q => q.id);
  if (!ids.length) {
    if (mode === 'wrong' || mode === 'star' || mode === 'skip') {
      showToast(mode === 'wrong' ? 'कोई गलत सवाल बाकी नहीं!' : (mode === 'skip' ? 'कोई छोड़ा गया सवाल बाकी नहीं!' : 'अभी कोई स्टार सवाल नहीं है!'));
      return;
    }
    ids = ch.questions.map(q => q.id);
  }
  app.userData.lastChId = chId;
  saveUserData(app.userId, app.userData);
  app.quiz = {
    chId,
    title: ch.title,
    mode,
    qIds: ids,
    cur: mode === 'resume' ? Math.min(prog.curIdx || 0, ids.length - 1) : 0,
    palOpen: false,
    palFilter: 'all',
    zoomOpen: false,
    showQInSol: false,
    showOther: false
  };
  app.view = 'quiz';
  render();
}

function stepQuiz(delta, viaSwipe) {
  const nxt = app.quiz.cur + delta;
  if (nxt < 0) { showToast('यह पहला सवाल है'); return; }
  if (nxt >= app.quiz.qIds.length) {
    showToast('यह आख़िरी सवाल है — नीचे "परिणाम देखें" दबाएँ');
    return;
  }
  app.quiz.cur = nxt;
  app.quiz.showQInSol = false;
  getChProg(app.quiz.chId).curIdx = nxt;
  saveUserData(app.userId, app.userData);
  if (viaSwipe) {
    showToast(delta > 0 ? '👉 स्वाइप: अगला सवाल #' + (nxt + 1) : '👈 स्वाइप: पिछला सवाल #' + (nxt + 1));
  } else {
    render();
  }
}

function openWaUrl(msg) {
  try {
    if (typeof window !== 'undefined' && window.open && !window.__DISABLE_POPUPS) {
      window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
    }
  } catch (_) {}
  showToast('📲 WhatsApp तैयार: ' + msg);
}

function handleAction(el, ev) {
  const act = el.getAttribute('data-act');
  if (!act) return;

  if (act === 'choose-user') {
    app.userId = el.getAttribute('data-u') === 'p' ? 'p' : 'm';
    saveLS('tgt_gk_active_user_v1', app.userId);
    app.userData = loadUserData(app.userId);
    app.zoomPct = loadGlobalZoom();
    app.userData.zoomPct = app.zoomPct;
    app.duel.customName = defaultPlayerName();
    app.view = app.duel.prefillCode ? 'duel' : 'home';
    render();
    sendPresence(true);
    syncLiveState();
    return;
  }
  if (act === 'open-welcome') {
    sendPresence(false, true);
    stopDuelTimer();
    app.view = 'welcome';
    render(); return;
  }
  if (act === 'back-home') {
    stopDuelTimer();
    app.view = 'home';
    render(); return;
  }
  if (act === 'sel-sub') { app.userData.tabId = el.getAttribute('data-v'); saveUserData(app.userId, app.userData); render(); return; }
  if (act === 'tog-ready') { app.userData.onlyReady = !app.userData.onlyReady; saveUserData(app.userId, app.userData); render(); return; }
  if (act === 'tog-paper') { app.userData.paperTint = !app.userData.paperTint; saveUserData(app.userId, app.userData); render(); return; }
  if (act === 'tog-twig') { const cid = el.getAttribute('data-cid'); app.doneTwigCh = app.doneTwigCh === cid ? '' : cid; render(); return; }
  if (act === 'soon-ch') { showToast('📚 "' + el.getAttribute('data-t') + '" जल्द जुड़ेगा!'); return; }
  if (act === 'open-ch') { openChapter(el.getAttribute('data-cid'), el.getAttribute('data-mode') || 'full'); return; }
  if (act === 'trigger-import') { const inp = document.getElementById('jsonImportInput'); if (inp && inp.click) inp.click(); return; }

  // Quiz actions
  if (act === 'q-pick') {
    const ch = CHAPTER_BANK[app.quiz.chId];
    const qId = app.quiz.qIds[app.quiz.cur];
    const prog = getChProg(ch.id);
    prog.answers[qId] = Number(el.getAttribute('data-i'));
    prog.curIdx = app.quiz.cur;
    saveUserData(app.userId, app.userData);
    app.quiz.showQInSol = false;
    render(); return;
  }
  if (act === 'q-skip') {
    const ch = CHAPTER_BANK[app.quiz.chId];
    const qId = app.quiz.qIds[app.quiz.cur];
    const prog = getChProg(ch.id);
    prog.answers[qId] = -1;
    prog.curIdx = app.quiz.cur;
    saveUserData(app.userId, app.userData);
    app.quiz.showQInSol = false;
    showToast('⏭ नहीं आता (0 निगेटिव अंक) · सही उत्तर देखें');
    return;
  }
  if (act === 'q-retry') {
    const qId = app.quiz.qIds[app.quiz.cur];
    const prog = getChProg(app.quiz.chId);
    delete prog.answers[qId];
    app.quiz.showQInSol = false;
    saveUserData(app.userId, app.userData);
    render(); return;
  }
  if (act === 'q-step') {
    stepQuiz(Number(el.getAttribute('data-d')) || 1, false);
    return;
  }
  if (act === 'q-jump') {
    const nxt = Number(el.getAttribute('data-i')) || 0;
    app.quiz.cur = nxt; app.quiz.palOpen = false; app.quiz.showQInSol = false;
    getChProg(app.quiz.chId).curIdx = nxt;
    saveUserData(app.userId, app.userData);
    render(); return;
  }
  if (act === 'q-pal-tog' || act === 'q-pal-bg') {
    if (act === 'q-pal-bg' && ev && ev.target && ev.target !== el) return;
    app.quiz.palOpen = !app.quiz.palOpen; render(); return;
  }
  if (act === 'q-pal-f') { app.quiz.palFilter = el.getAttribute('data-v'); render(); return; }
  if (act === 'q-ztog') { app.quiz.zoomOpen = !app.quiz.zoomOpen; render(); return; }
  if (act === 'q-zset') {
    const z = saveGlobalZoom(Number(el.getAttribute('data-v')) || 100);
    showToast(z === 100 ? '↺ ज़ूम रीसेट: 100% (डिफ़ॉल्ट)' : 'ज़ूम सेव: ' + z + '% (हर सवाल व पाठ)');
    return;
  }
  if (act === 'q-zstep') {
    const z = saveGlobalZoom((app.zoomPct || 100) + (Number(el.getAttribute('data-d')) || 0));
    showToast('ज़ूम: ' + z + '% (स्थायी सेव)');
    return;
  }
  if (act === 'q-tog-q' || act === 'q-tog-other') { app.quiz.showQInSol = !app.quiz.showQInSol; render(); return; }
  if (act === 'q-star') {
    const qId = app.quiz.qIds[app.quiz.cur];
    const prog = getChProg(app.quiz.chId);
    prog.stars[qId] = !prog.stars[qId];
    saveUserData(app.userId, app.userData);
    showToast(prog.stars[qId] ? '★ स्टार में सहेजा गया' : '☆ स्टार हटाया गया');
    return;
  }
  if (act === 'q-speak') {
    const ch = CHAPTER_BANK[app.quiz.chId];
    const q = ch.questions.find(x => x.id === app.quiz.qIds[app.quiz.cur]);
    if (q) speakHindi('सही उत्तर: ' + q.opts[q.ans] + '। ' + splitReadablePoints(q.exp).join(' '));
    return;
  }
  if (act === 'finish-ch') {
    const prog = getChProg(app.quiz.chId);
    prog.finished = true;
    saveUserData(app.userId, app.userData);
    app.quiz.palOpen = false; app.result.openQId = null; app.view = 'result';
    render(); return;
  }

  // Result actions
  if (act === 'r-mark') { app.result.marking = el.getAttribute('data-k'); render(); return; }
  if (act === 'r-tog') { const id = Number(el.getAttribute('data-id')); app.result.openQId = app.result.openQId === id ? null : id; render(); return; }

  // JOD 2028 (JOD Lab) 1v1 Challenge actions
  if (act === 'open-duel') {
    if ((app.view === 'quiz' || app.view === 'result') && CHAPTER_BANK[app.quiz.chId]) {
      app.duel.scope = app.quiz.chId;
    } else if (!CHAPTER_BANK[app.duel.scope] && app.duel.scope !== 'mix') {
      app.duel.scope = Object.keys(CHAPTER_BANK)[0] || 'ch01';
    }
    if (!app.duel.customName) app.duel.customName = defaultPlayerName();
    if (app.duel.stage !== 'live' && app.duel.stage !== 'lobby' && app.duel.stage !== 'count') {
      app.duel.stage = 'menu';
    }
    app.duel.err = '';
    app.view = 'duel';
    render();
    sendPresence(true);
    syncLiveState();
    return;
  }
  if (act === 'd-back') {
    if (app.duel.stage === 'lobby') { leaveDuelRoom(false); return; }
    if (app.duel.stage === 'result') { leaveDuelRoom(true); return; }
    app.view = 'home'; render(); return;
  }
  if (act === 'd-ztog') { app.duel.zoomOpen = !app.duel.zoomOpen; render(); return; }
  if (act === 'd-scope') {
    readAndSaveDuelName();
    app.duel.scope = el.getAttribute('data-v');
    const mx = duelPoolMax(app.duel.scope);
    if (!app.duel.allScope && app.duel.count > mx) app.duel.count = Math.min(30, mx);
    render(); return;
  }
  if (act === 'd-cnt') {
    readAndSaveDuelName();
    app.duel.allScope = false;
    app.duel.count = Math.max(1, Number(el.getAttribute('data-v')) || 30);
    render(); return;
  }
  if (act === 'd-cnt-all') {
    readAndSaveDuelName();
    app.duel.allScope = true;
    app.duel.count = duelPoolMax(app.duel.scope) || 30;
    render(); return;
  }
  if (act === 'd-cnt-step') {
    readAndSaveDuelName();
    app.duel.allScope = false;
    const mx = Math.max(1, duelPoolMax(app.duel.scope) || 30);
    const cur = duelEffCount();
    app.duel.count = Math.max(1, Math.min(mx, cur + (Number(el.getAttribute('data-d')) || 0)));
    render(); return;
  }
  if (act === 'd-create' || act === 'd-send-invite') { createDuelRoom(false); return; }
  if (act === 'd-solo') { createDuelRoom(true); return; }
  if (act === 'd-join') { joinDuelRoom(''); return; }
  if (act === 'd-accept') { acceptDuelInvite(); return; }
  if (act === 'd-reject') { rejectDuelInvite(); return; }
  if (act === 'd-start-room' || act === 'd-start') { startDuelRoom(false); return; }
  if (act === 'd-start-solo-room') { startDuelRoom(true); return; }
  if (act === 'd-leave-room' || act === 'd-cancel') { leaveDuelRoom(false); return; }
  if (act === 'd-leave-home' || act === 'd-lobby') { leaveDuelRoom(true); return; }
  if (act === 'd-ask-leave') { app.duel.leaveOpen = true; render(); return; }
  if (act === 'd-leave-no') { app.duel.leaveOpen = false; render(); return; }
  if (act === 'd-leave-yes') { leaveDuelRoom(true); return; }
  if (act === 'd-pick') { handleDuelPick(Number(el.getAttribute('data-i'))); return; }
  if (act === 'd-skip') { handleDuelSkip(); return; }
  if (act === 'd-step' || act === 'd-next') { stepDuel(Number(el.getAttribute('data-d')) || 1, false); return; }
  if (act === 'd-jump') { app.duel.qIdx = Number(el.getAttribute('data-i')) || 0; app.duel.palOpen = false; render(); return; }
  if (act === 'd-pal-tog' || act === 'd-pal-bg') {
    if (act === 'd-pal-bg' && ev && ev.target && ev.target !== el) return;
    app.duel.palOpen = !app.duel.palOpen; render(); return;
  }
  if (act === 'd-pal-f') { app.duel.palFilter = el.getAttribute('data-v'); render(); return; }
  if (act === 'd-star') {
    const q = app.duel.qs[app.duel.qIdx];
    const cid = q && (q._chId || (app.duel.scope !== 'mix' ? app.duel.scope : 'ch01'));
    if (q && CHAPTER_BANK[cid]) {
      const prog = getChProg(cid);
      prog.stars[q.id] = !prog.stars[q.id];
      saveUserData(app.userId, app.userData);
      showToast(prog.stars[q.id] ? '★ स्टार में सहेजा गया' : '☆ स्टार हटाया गया');
    }
    return;
  }
  if (act === 'd-speak') {
    const q = app.duel.qs[app.duel.qIdx];
    if (q) speakHindi('सही उत्तर: ' + q.opts[q.ans] + '। ' + splitReadablePoints(q.exp).join(' '));
    return;
  }
  if (act === 'd-finish') { finishDuelRun(); return; }
  if (act === 'd-rematch') { rematchDuelRoom(); return; }
  if (act === 'd-tog-rev') { app.duel.showReview = !app.duel.showReview; render(); return; }
  if (act === 'd-res-exp') { const i = Number(el.getAttribute('data-i')); app.duel.resOpenIdx = app.duel.resOpenIdx === i ? null : i; render(); return; }
  if (act === 'd-wa-room' || act === 'd-wa-invite') {
    const link = el.getAttribute('data-link') || 'https://jodexam777-air1.github.io/tgtgk/';
    const scTitle = app.duel.scope === 'mix' ? 'सभी मिक्स सवाल' : (CHAPTER_BANK[app.duel.scope]?.title || 'पाठ');
    openWaUrl('⚔️ TGT GK 1v1 Challenge!\nपाठ: ' + scTitle + ' (' + duelEffCount() + ' सवाल)\nRoom Code: ' + app.duel.code + '\nसीधे जुड़ने के लिए यह लिंक खोलें:\n' + link);
    return;
  }
  if (act === 'd-wa-share') {
    const myS = calcMyDuelStats();
    const opP = duelOppPlayer();
    const myNm = app.duel.customName || defaultPlayerName();
    openWaUrl('🏆 TGT GK 1v1 परिणाम: ' + myNm + ' ' + myS.pts + ' अंक (' + myS.ok + '/' + app.duel.qs.length + ')' + (opP ? ' vs ' + opP.name + ' ' + (opP.pts || 0) + ' अंक' : '') + '!');
    return;
  }
}

document.addEventListener('click', (e) => {
  const t = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if (t) handleAction(t, e);
});

document.addEventListener('input', (e) => {
  const t = e.target;
  if (!t || !t.id) return;
  if (t.id === 'duelCntInp') {
    const mx = Math.max(1, duelPoolMax(app.duel.scope) || 30);
    const raw = parseInt(t.value, 10);
    if (Number.isFinite(raw) && raw >= 1) {
      app.duel.allScope = false;
      app.duel.count = Math.min(mx, raw);
      const eff = duelEffCount();
      const cBtn = document.getElementById('duelCreateBtn');
      const sBtn = document.getElementById('duelSoloBtn');
      if (cBtn) cBtn.textContent = '⚔️ Room बनाएँ (' + eff + ' सवाल)';
      if (sBtn) sBtn.textContent = '⚡ अकेले प्रैक्टिस टेस्ट चलाएँ (' + eff + ' सवाल · बिना इंतज़ार)';
    }
  } else if (t.id === 'duelNameInp') {
    app.duel.customName = String(t.value || '').slice(0, 16);
    saveLS('tgt_gk_duel_name_' + app.userId, app.duel.customName.trim() || defaultPlayerName());
  } else if (t.id === 'duelCodeInp') {
    app.duel.prefillCode = String(t.value || '').replace(/\D/g, '').slice(0, 4);
  }
});

const impEl = document.getElementById('jsonImportInput');
if (impEl && impEl.addEventListener) {
  impEl.addEventListener('change', (e) => {
    const files = e.target && e.target.files ? Array.from(e.target.files) : [];
    files.forEach(f => {
      const r = new FileReader();
      r.onload = () => {
        try { importChapterData(JSON.parse(r.result)); render(); }
        catch (err) { showToast('त्रुटि: ' + err.message); }
      };
      r.readAsText(f);
    });
    e.target.value = '';
  });
}

function startLiveSyncLoop() {
  if (!FIREBASE_DB_URL || typeof window === 'undefined' || window.__DISABLE_TIMERS) return;
  if (typeof setInterval === 'function') {
    setInterval(() => {
      if (typeof document === 'undefined' || document.visibilityState !== 'hidden') sendPresence(true);
    }, 6000);
  }
  const stepPoll = async () => {
    await syncLiveState();
    const fast = app.duel.stage === 'lobby' || app.duel.stage === 'result';
    if (typeof setTimeout === 'function') setTimeout(stepPoll, fast ? 1400 : 3000);
  };
  if (typeof setTimeout === 'function') setTimeout(stepPoll, 900);
  if (typeof document !== 'undefined' && document.addEventListener) {
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') sendPresence(false, true);
      else { sendPresence(true); syncLiveState(); }
    });
  }
  if (window.addEventListener) {
    window.addEventListener('pagehide', () => sendPresence(false, true));
  }
}

function bindQuizSwipe() {
  const root = document.getElementById('appRoot');
  if (!root || !root.addEventListener) return;
  let sx = 0, sy = 0, st = 0, tracking = false;
  const canSwipeNow = () => {
    if (hasIncomingChallenge()) return false;
    if (app.view === 'quiz' && !app.quiz.palOpen) return true;
    if (app.view === 'duel' && app.duel.stage === 'live' && !app.duel.palOpen && !app.duel.leaveOpen) return true;
    return false;
  };
  root.addEventListener('touchstart', (e) => {
    if (!canSwipeNow()) { tracking = false; return; }
    const tgt = e.target;
    if (tgt && tgt.closest && tgt.closest('.q-strip, .zoom-bar, .sheet-bg, .modal-bg, .mtab, .battle')) { tracking = false; return; }
    const touches = e.touches || e.changedTouches;
    if (touches && touches.length !== 1) { tracking = false; return; }
    const t = touches ? touches[0] : null;
    if (!t) { tracking = false; return; }
    sx = t.clientX; sy = t.clientY; st = Date.now(); tracking = true;
  }, { passive: true });
  root.addEventListener('touchend', (e) => {
    if (!tracking) return;
    tracking = false;
    if (!canSwipeNow()) return;
    const t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    const dx = t.clientX - sx, dy = t.clientY - sy, dt = Date.now() - st;
    if (Math.abs(dx) >= 55 && Math.abs(dx) > Math.abs(dy) * 1.45 && dt <= 750) {
      if (app.view === 'duel') stepDuel(dx < 0 ? 1 : -1, true);
      else stepQuiz(dx < 0 ? 1 : -1, true);
    }
  }, { passive: true });
}

initChapterStore();
duelPid();
bindQuizSwipe();
const urlRoomMatch = (typeof location !== 'undefined' && location.search) ? location.search.match(/[?&]room=(\d{4})/) : null;
if (urlRoomMatch) app.duel.prefillCode = urlRoomMatch[1];

const savedUid = safeLS('tgt_gk_active_user_v1', '');
if (savedUid === 'm' || savedUid === 'p') {
  app.userId = savedUid;
  app.userData = loadUserData(savedUid);
  app.zoomPct = loadGlobalZoom();
  app.userData.zoomPct = app.zoomPct;
  app.duel.customName = defaultPlayerName();
  app.view = app.duel.prefillCode ? 'duel' : 'home';
}
render();
if (app.view !== 'welcome' && typeof window !== 'undefined' && !window.__DISABLE_TIMERS) {
  sendPresence(true);
  syncLiveState();
}
startLiveSyncLoop();

if (typeof globalThis !== 'undefined') {
  globalThis.__TGT_APP = {
    app, ROADMAP, CHAPTER_BANK, openChapter, stepQuiz, loadGlobalZoom, saveGlobalZoom, splitReadablePoints, highlightHindiFacts,
    importChapterData, calcMarks, handleAction, render, getChProg, getUserStats,
    createDuelRoom, joinDuelRoom, startDuelRoom, handleDuelPick, handleDuelSkip, stepDuel, finishDuelRun, rematchDuelRoom, leaveDuelRoom,
    startDuelMatch, sendPresence, syncLiveState, sendDuelInvite, acceptDuelInvite, rejectDuelInvite, cancelDuelInvite, advanceDuelNext
  };
}
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}</script>
