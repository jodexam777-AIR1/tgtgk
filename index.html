function safeLS(key, fallback) {
  try {
    if (typeof localStorage === 'undefined') return fallback;
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (_) { return fallback; }
}
function saveLS(key, val) {
  try { if (typeof localStorage !== 'undefined') localStorage.setItem(key, JSON.stringify(val)); } catch (_) {}
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function avImg(who, cls, st) {
  const av = (typeof window !== 'undefined' && window.TGT_AVATARS) ? window.TGT_AVATARS : {};
  const src = (who === 'p' ? av.priyanka : av.manju) || '';
  const alt = who === 'p' ? 'प्रियंका' : 'मंजू';
  return '<img class="' + (cls || 'av-xs') + '" src="' + src + '" alt="' + alt + '"' + (st ? ' style="' + st + '"' : '') + '>';
}

// Chapter Store (Bundle + LocalStorage imported JSONs)
const CHAPTER_BANK = {};
function normalizeRawChapter(data) {
  if (!data || !data.id || !data.title || !Array.isArray(data.questions) || !data.questions.length) {
    throw new Error('अमान्य पाठ फ़ाइल: id, title या questions गायब हैं।');
  }
  const qs = data.questions.map((q, idx) => {
    if (!Array.isArray(q.opts) || q.opts.length !== 4 || typeof q.ans !== 'number') {
      throw new Error('सवाल #' + (idx + 1) + ' में 4 विकल्प और ans होना आवश्यक है।');
    }
    let rawQ = String(q.q || '').trim();
    let stem = rawQ, src = q.src ? String(q.src) : '';
    if (!src) {
      const m = rawQ.match(/\s*\[((?:किताब|PYQ)[^\]]*)\]\s*$/);
      if (m) { stem = rawQ.slice(0, m.index).trim(); src = '(' + m[1].trim() + ')'; }
      else { src = '(किताब: ' + String(data.pages || '') + ')'; }
    }
    const cleanExp = String(q.exp || '')
      .replace(/⚠️\s*किताब सुधार\s*:?|किताब सुधार\s*:?/g, 'सटीक तथ्य:')
      .replace(/\u092f\u0939 \u092e\u092e\u094d\u092e\u0940 \u0915\u0940 \u0905\u092a\u0928\u0940\s+/g, 'यह अपनी ')
      .replace(/\u092e\u092e\u094d\u092e\u0940,\s*\u0907\u0928 \u0924\u0940\u0928\u094b\u0902/g, 'इन तीनों')
      .replace(/\u092e\u092e\u094d\u092e\u0940 \u0915\u094b \u0938\u094d\u092a\u0937\u094d\u091f \u0909\u0924\u094d\u0924\u0930 \u0938\u093f\u0916\u093e\u0928\u0947 \u0939\u0947\u0924\u0941\s+/g, 'स्पष्ट उत्तर हेतु ')
      .replace(/⚠️/g, '').trim();
    return {
      id: q.id != null ? q.id : idx + 1,
      type: q.type || 'BOOK',
      fmt: q.fmt || 'Direct',
      q: stem,
      src: src,
      opts: q.opts.map(String),
      ans: q.ans,
      exp: cleanExp,
      trick: String(q.trick || '').replace(/⚠️/g, '').trim(),
      vip: !!q.vip,
      match: Array.isArray(q.match) && q.match.length ? q.match : null
    };
  });
  return {
    id: String(data.id),
    num: Number(data.num || 0),
    subject: String(data.subject || ''),
    chapter_code: String(data.chapter_code || ''),
    title: String(data.title).trim(),
    pages: String(data.pages || ''),
    total_questions: qs.length,
    questions: qs
  };
}

function initChapterStore() {
  const b = (typeof window !== 'undefined' && window.TGT_CHAPTERS) ? window.TGT_CHAPTERS : {};
  Object.keys(b).forEach(k => { try { CHAPTER_BANK[k] = normalizeRawChapter(b[k]); } catch (_) {} });
  const extra = safeLS('tgt_gk_extra_chapters_v1', {});
  Object.keys(extra).forEach(k => { try { CHAPTER_BANK[k] = normalizeRawChapter(extra[k]); } catch (_) {} });
  attachChaptersToRoadmap();
}

function normTitle(t) {
  return String(t || '').replace(/\s+/g, '').replace(/[()\-–।]/g, '').toLowerCase();
}
function subjectIdFromText(subj) {
  const s = String(subj || '');
  if (s.includes('पर्यावरण')) return 'env';
  if (s.includes('राज') || s.includes('संविधान')) return 'pol';
  if (s.includes('इतिहास')) return 'his';
  if (s.includes('भूगोल') || s.includes('जनगणना')) return 'geo';
  if (s.includes('अर्थ')) return 'eco';
  if (s.includes('विज्ञान') || s.includes('स्वास्थ्य')) return 'sci';
  if (s.includes('संस्कृति') || s.includes('स्टैटिक')) return 'sta';
  return 'up';
}

function attachChaptersToRoadmap() {
  ROADMAP.forEach(s => s.chapters.forEach(c => { if (!c._baseChId) c._baseChId = c.chId || ''; c.liveId = ''; }));
  Object.values(CHAPTER_BANK).forEach(ch => {
    let matched = null;
    for (const s of ROADMAP) {
      for (const c of s.chapters) {
        if ((c._baseChId && c._baseChId === ch.id) || normTitle(c.t) === normTitle(ch.title)) {
          matched = c; break;
        }
      }
      if (matched) break;
    }
    if (matched) {
      matched.liveId = ch.id;
      matched.q = ch.total_questions;
      if (ch.pages) matched.p = ch.pages.replace(/\s*\(PDF[^)]*\)/g, '').trim();
    } else {
      const sid = subjectIdFromText(ch.subject);
      const sub = ROADMAP.find(s => s.id === sid) || ROADMAP[6];
      sub.chapters.push({ t: ch.title, p: ch.pages || 'नया पाठ', est: ch.total_questions, q: ch.total_questions, exam: 'both', liveId: ch.id, _baseChId: ch.id });
    }
  });
}

function importChapterData(rawJson) {
  const ch = normalizeRawChapter(rawJson);
  CHAPTER_BANK[ch.id] = ch;
  const extra = safeLS('tgt_gk_extra_chapters_v1', {});
  extra[ch.id] = ch;
  saveLS('tgt_gk_extra_chapters_v1', extra);
  attachChaptersToRoadmap();
  showToast('✅ नया पाठ जुड़ा: ' + ch.title + ' (' + ch.total_questions + ' सवाल)');
  return ch;
}

function getUserStats(uid) {
  const ud = uid === app.userId ? app.userData : loadUserData(uid);
  let doneCh = 0, seen = 0, ok = 0;
  Object.keys(CHAPTER_BANK).forEach(cid => {
    const p = ud.progress[cid];
    if (!p) return;
    const ansMap = p.answers || {};
    const keys = Object.keys(ansMap);
    if (keys.length >= CHAPTER_BANK[cid].questions.length || p.finished) doneCh++;
    CHAPTER_BANK[cid].questions.forEach(q => {
      if (ansMap[q.id] !== undefined) {
        seen++;
        if (ansMap[q.id] === q.ans) ok++;
      }
    });
  });
  const acc = seen ? Math.round((ok / seen) * 100) : 0;
  return { doneCh, seen, ok, acc };
}

function buildExpTimeline(rawExp) {
  const clean = String(rawExp || '').replace(/⚠️\s*किताब सुधार\s*:?|किताब सुधार\s*:?/g, 'सटीक तथ्य:').replace(/⚠️/g, '').trim();
  const parts = clean
    .replace(/([।!])\s+/g, '$1\n')
    .replace(/;\s+/g, '\n')
    .replace(/सही मिलान:\s*/g, '\nसही मिलान: ')
    .split(/\n+/)
    .map(s => s.replace(/^[•\-]\s*/, '').trim())
    .filter(Boolean);
  const lead = parts.length ? parts[0] : '';
  const points = parts.slice(1);
  return { lead, points };
}

function calcMarks(right, wrong, total, mode) {
  if (mode === 'up') return { big: (right * 3 - wrong) + ' / ' + (total * 3) + ' अंक', sub: 'UP TGT (+3 / −1) · ' + right + '×3 − ' + wrong + '×1' };
  if (mode === 'delhi') return { big: (right - wrong * 0.25) + ' / ' + total + ' अंक', sub: 'दिल्ली (+1 / −0.25) · ' + right + ' − ' + (wrong * 0.25) };
  const pct = total ? Math.round((right / total) * 100) : 0;
  return { big: right + ' / ' + total + ' सही', sub: pct + '% सटीकता · शानदार अभ्यास!' };
}

function buildDuelRefs(scope, count) {
  let pool = [];
  if (scope === 'mix') {
    Object.keys(CHAPTER_BANK).forEach(cid => CHAPTER_BANK[cid].questions.forEach(q => {
      if (!q.match) pool.push({ chId: cid, qId: q.id });
    }));
  } else if (CHAPTER_BANK[scope]) {
    pool = CHAPTER_BANK[scope].questions.filter(q => !q.match).map(q => ({ chId: scope, qId: q.id }));
    if (pool.length < count) pool = CHAPTER_BANK[scope].questions.map(q => ({ chId: scope, qId: q.id }));
  }
  const arr = pool.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr.slice(0, Math.min(count, arr.length));
}

function buildDuelPool(scope, count) {
  return buildDuelRefs(scope, count).map(r => {
    const ch = CHAPTER_BANK[r.chId];
    return ch ? ch.questions.find(q => q.id === r.qId) : null;
  }).filter(Boolean);
}

function resolveDuelQuestions(qRefs) {
  const list = Array.isArray(qRefs) ? qRefs : Object.values(qRefs || {});
  return list.map(r => {
    const ch = r && CHAPTER_BANK[r.chId];
    return ch ? ch.questions.find(q => q.id === r.qId) : null;
  }).filter(Boolean);
}

function fbUrl(subPath) {
  const base = String(FIREBASE_DB_URL || '').replace(/\/+$/, '');
  return base + (subPath ? '/' + subPath.replace(/^\/+/, '') : '') + '.json';
}

async function fbReq(subPath, method, bodyObj, keepalive) {
  if (!FIREBASE_DB_URL || typeof fetch !== 'function') return null;
  try {
    const opts = { method: method || 'GET' };
    if (keepalive) opts.keepalive = true;
    if (bodyObj !== undefined) {
      opts.headers = { 'Content-Type': 'application/json' };
      opts.body = JSON.stringify(bodyObj);
    }
    const resp = await fetch(fbUrl(subPath), opts);
    if (!resp.ok) {
      app.duel.netOk = false;
      return null;
    }
    app.duel.netOk = true;
    return await resp.json();
  } catch (_) {
    app.duel.netOk = false;
    return null;
  }
}

async function sendPresence(isOnline, keepalive) {
  if (!FIREBASE_DB_URL || app.view === 'welcome') return null;
  const uid = app.userId === 'p' ? 'p' : 'm';
  const res = await fbReq('presence/' + uid, 'PUT', {
    ts: { '.sv': 'timestamp' },
    online: isOnline !== false
  }, keepalive);
  if (res && typeof res.ts === 'number') {
    app.duel.serverOffset = res.ts - Date.now();
  }
  return res;
}

function hasIncomingChallenge() {
  if (app.view === 'welcome') return false;
  const d = app.duel, m = d.remoteMatch;
  if (!m || m.status !== 'ringing' || m.to !== app.userId) return false;
  if (m.id === d.lastRejectedId || m.id === d.matchId) return false;
  if (typeof m.createdAt === 'number' && (serverNow() - m.createdAt) > 90000) return false;
  return true;
}

function startDuelTicker() {
  stopDuelTimer();
  if (typeof setInterval === 'function' && typeof window !== 'undefined' && !window.__DISABLE_TIMERS) {
    app.duel.timerId = setInterval(() => {
      const d = app.duel;
      if (app.view !== 'duel' || d.stage !== 'live') return;
      const m = d.remoteMatch;
      const qStart = (m && typeof m.qStartAt === 'number') ? m.qStartAt : serverNow();
      d.timer = Math.max(0, 25 - Math.floor((serverNow() - qStart) / 1000));
      if (d.timer <= 0 && d.picked === null) {
        handleDuelPick(-1);
        return;
      }
      if (d.picked === null || !d.pAnswered) render();
    }, 1000);
  }
}

function recomputeDuelFromMatch(m) {
  const d = app.duel;
  const myId = app.userId === 'p' ? 'p' : 'm';
  const opId = myId === 'p' ? 'm' : 'p';
  const qs = resolveDuelQuestions(m.qRefs);
  if (qs.length) d.qs = qs;
  d.scope = m.scope || d.scope;
  d.count = m.count || d.qs.length || d.count;
  d.qIdx = Math.max(0, Math.min(Math.max(0, d.qs.length - 1), Number(m.qIdx || 0)));

  const qStart = typeof m.qStartAt === 'number' ? m.qStartAt : serverNow();
  d.timer = (typeof window !== 'undefined' && window.__DISABLE_TIMERS)
    ? 25
    : Math.max(0, 25 - Math.floor((serverNow() - qStart) / 1000));

  const ansMap = m.ans || {};
  d.mScore = 0; d.pScore = 0; d.mStreak = 0;
  d.dots = Array(d.qs.length).fill('w');
  d.history = [];
  d.picked = null;
  d.pAnswered = false;
  d.pCorrect = false;

  d.qs.forEach((q, i) => {
    const qa = ansMap[i] || ansMap[String(i)] || {};
    const myA = qa[myId];
    const opA = qa[opId];
    if (myA) {
      if (myA.ok) { d.mScore += 1; d.mStreak += 1; d.dots[i] = 'g'; }
      else { d.mStreak = 0; d.dots[i] = 'r'; }
    }
    if (opA && opA.ok) d.pScore += 1;

    if (i === d.qIdx) {
      d.picked = myA ? myA.idx : null;
      d.pAnswered = !!opA;
      d.pCorrect = !!(opA && opA.ok);
    }

    const roundDone = !!(myA && (opA || d.timer <= 0 || m.status === 'ended' || i < d.qIdx));
    if (myA || opA || i < d.qIdx || m.status === 'ended') {
      const mText = myA ? (myA.idx >= 0 && q.opts[myA.idx] !== undefined ? q.opts[myA.idx] : 'समय समाप्त') : 'छोड़ा';
      const pText = opA ? (opA.idx >= 0 && q.opts[opA.idx] !== undefined ? q.opts[opA.idx] : 'समय समाप्त') : 'छोड़ा';
      d.history.push({
        qNum: i + 1,
        q: q.q,
        mOk: !!(myA && myA.ok),
        pOk: !!(opA && opA.ok),
        mAns: mText,
        pAns: pText,
        right: q.opts[q.ans],
        exp: q.exp,
        show: roundDone || m.status === 'ended'
      });
    }
  });
}

function applyRemoteState(data) {
  const d = app.duel;
  const myId = app.userId === 'p' ? 'p' : 'm';
  const opId = myId === 'p' ? 'm' : 'p';
  const opName = opId === 'p' ? 'प्रियंका' : 'मंजू';
  const prevOnline = d.opOnline;
  const prevPopup = hasIncomingChallenge();
  const prevSig = d.lastUiSig;

  const pres = data && data.presence ? data.presence : null;
  d.remotePresence = pres;
  const opP = pres ? pres[opId] : null;
  d.opOnline = !!(opP && opP.online !== false && typeof opP.ts === 'number' && (serverNow() - opP.ts) < 18000);

  const m = data && data.match ? data.match : null;
  d.remoteMatch = m;

  if (d.stage === 'waiting' && d.matchId) {
    if (m && m.id === d.matchId) {
      if (m.status === 'live') {
        recomputeDuelFromMatch(m);
        d.stage = 'live';
        app.view = 'duel';
        startDuelTicker();
        showToast('⚔️ ' + opName + ' जुड़ गईं — मुक़ाबला शुरू!');
      } else if (m.status === 'rejected') {
        stopDuelTimer();
        d.stage = 'lobby';
        d.matchId = '';
        showToast('🔔 ' + opName + ' अभी व्यस्त हैं — बाद में खेलें');
      } else if (m.status === 'cancelled') {
        stopDuelTimer();
        d.stage = 'lobby';
        d.matchId = '';
      } else if (m.status === 'ringing' && typeof m.createdAt === 'number' && (serverNow() - m.createdAt) > 75000) {
        fbReq('match', 'PATCH', { status: 'cancelled' });
        stopDuelTimer();
        d.stage = 'lobby';
        d.matchId = '';
        showToast('जवाब नहीं मिला — WhatsApp पर बुलाकर फिर भेजें');
      }
    }
  } else if (d.stage === 'live' && d.matchId) {
    if (m && m.id === d.matchId) {
      recomputeDuelFromMatch(m);
      if (m.status === 'ended') {
        stopDuelTimer();
        d.stage = 'result';
      }
    }
  }

  const nextPopup = hasIncomingChallenge();
  const curSig = (app.view === 'duel')
    ? JSON.stringify([d.opOnline, d.netOk, nextPopup, d.stage, d.matchId, d.qIdx, d.mScore, d.pScore, d.picked, d.pAnswered, m && m.status, m && m.qIdx, m && m.ans])
    : JSON.stringify([d.opOnline, d.netOk, nextPopup, d.stage, d.matchId]);

  d.lastUiSig = curSig;
  if (curSig !== prevSig || prevOnline !== d.opOnline || prevPopup !== nextPopup) {
    render();
  }
}

async function syncLiveState() {
  if (!FIREBASE_DB_URL) return null;
  const data = await fbReq('', 'GET');
  if (data !== null || !app.duel.netOk) {
    applyRemoteState(data || {});
  }
  return data;
}

async function sendDuelInvite() {
  if (app.duel.submitting) return;
  const d = app.duel;
  const myId = app.userId === 'p' ? 'p' : 'm';
  const opId = myId === 'p' ? 'm' : 'p';
  const qRefs = buildDuelRefs(d.scope, d.count);
  if (!qRefs.length) { showToast('इस विषय में अभी सवाल नहीं हैं'); return; }

  const matchId = myId + '_' + Date.now() + '_' + Math.floor(Math.random() * 9000 + 1000);
  const scopeTitle = d.scope === 'mix' ? 'सभी मिक्स सवाल' : (CHAPTER_BANK[d.scope]?.title || 'पाठ');
  d.submitting = true;
  d.matchId = matchId;
  d.inviteSentAt = Date.now();
  d.qs = resolveDuelQuestions(qRefs);
  d.qIdx = 0; d.mScore = 0; d.pScore = 0; d.mStreak = 0;
  d.dots = Array(d.qs.length).fill('w');
  d.history = []; d.picked = null; d.pAnswered = false; d.pCorrect = false;
  d.resOpenIdx = null; d.timer = 25;
  d.stage = 'waiting';
  app.view = 'duel';
  render();

  const payload = {
    id: matchId,
    from: myId,
    to: opId,
    status: 'ringing',
    scope: d.scope,
    scopeTitle,
    count: qRefs.length,
    createdAt: { '.sv': 'timestamp' },
    qIdx: 0,
    qStartAt: { '.sv': 'timestamp' },
    qRefs,
    ans: {}
  };
  const res = await fbReq('match', 'PUT', payload);
  d.submitting = false;
  if (!res) {
    d.stage = 'lobby';
    d.matchId = '';
    showToast('📶 इंटरनेट चालू करें — चैलेंज नहीं जा सका');
    return;
  }
  d.remoteMatch = res;
}

function startDuelMatch() {
  return sendDuelInvite();
}

async function acceptDuelInvite() {
  const d = app.duel, m = d.remoteMatch;
  if (!m) return;
  const qs = resolveDuelQuestions(m.qRefs);
  if (!qs.length) {
    showToast('यह पाठ अभी इस फ़ोन में अपडेट नहीं है');
    return;
  }
  d.matchId = m.id;
  d.scope = m.scope || 'ch01';
  d.count = m.count || qs.length;
  d.qs = qs;
  d.qIdx = 0; d.mScore = 0; d.pScore = 0; d.mStreak = 0;
  d.dots = Array(qs.length).fill('w');
  d.history = []; d.picked = null; d.pAnswered = false; d.pCorrect = false;
  d.resOpenIdx = null; d.timer = 25;
  d.stage = 'live';
  app.view = 'duel';
  if (d.remoteMatch) {
    d.remoteMatch.status = 'live';
    d.remoteMatch.qIdx = 0;
    d.remoteMatch.qStartAt = serverNow();
  }
  startDuelTicker();
  render();
  await fbReq('match', 'PATCH', {
    status: 'live',
    qIdx: 0,
    qStartAt: { '.sv': 'timestamp' }
  });
}

async function rejectDuelInvite() {
  const d = app.duel, m = d.remoteMatch;
  if (m && m.id) d.lastRejectedId = m.id;
  if (d.remoteMatch) d.remoteMatch.status = 'rejected';
  showToast('चैलेंज अभी के लिए टाल दिया गया');
  if (m && m.id) {
    await fbReq('match', 'PATCH', { status: 'rejected' });
  }
}

async function cancelDuelInvite() {
  const d = app.duel;
  stopDuelTimer();
  d.stage = 'lobby';
  if (d.remoteMatch && d.remoteMatch.id === d.matchId) d.remoteMatch.status = 'cancelled';
  d.matchId = '';
  render();
  await fbReq('match', 'PATCH', { status: 'cancelled' });
}

async function handleDuelPick(idx) {
  const d = app.duel;
  if (d.picked !== null || d.stage !== 'live') return;
  const q = d.qs[d.qIdx];
  if (!q) return;
  const myId = app.userId === 'p' ? 'p' : 'm';
  const isOk = idx === q.ans;
  const entry = { idx, ok: isOk, at: { '.sv': 'timestamp' } };

  if (!d.remoteMatch) d.remoteMatch = { id: d.matchId, qIdx: d.qIdx, ans: {} };
  if (!d.remoteMatch.ans) d.remoteMatch.ans = {};
  if (!d.remoteMatch.ans[d.qIdx]) d.remoteMatch.ans[d.qIdx] = {};
  d.remoteMatch.ans[d.qIdx][myId] = { idx, ok: isOk, at: serverNow() };

  recomputeDuelFromMatch(d.remoteMatch);
  render();

  await fbReq('match/ans/' + d.qIdx + '/' + myId, 'PUT', entry);
}

async function advanceDuelNext() {
  const d = app.duel;
  if (d.stage !== 'live') return;
  if (d.qIdx + 1 >= d.qs.length) {
    stopDuelTimer();
    d.stage = 'result';
    if (d.remoteMatch) d.remoteMatch.status = 'ended';
    recomputeDuelFromMatch(d.remoteMatch || { qRefs: d.qs.map((q, i) => ({ chId: d.scope, qId: q.id })), ans: {} });
    render();
    await fbReq('match', 'PATCH', { status: 'ended' });
    return;
  }
  const nxt = d.qIdx + 1;
  d.qIdx = nxt;
  d.picked = null;
  d.pAnswered = false;
  d.pCorrect = false;
  d.timer = 25;
  if (d.remoteMatch) {
    d.remoteMatch.qIdx = nxt;
    d.remoteMatch.qStartAt = serverNow();
  }
  render();
  await fbReq('match', 'PATCH', { qIdx: nxt, qStartAt: { '.sv': 'timestamp' } });
}

        ? '<div style="background:' + (roundDone ? '#E8F5E9' : '#F8FAFC') + ';border:1.5px solid ' + (roundDone ? '#2E7D32' : '#94A3B8') + ';border-radius:11px;padding:10px;font-size:12.5px;display:flex;flex-direction:column;gap:8px;">' +
            '<div><strong>' + (d.picked === q.ans ? '✅ +1 ' + myName + '!' : '✗ सही उत्तर: ' + esc(q.opts[q.ans])) + '</strong> · ' +
              (d.pAnswered ? (opName + (d.pCorrect ? ' का भी सही ✓' : ' चूक गईं ✗')) : ('⏳ ' + opName + ' के जवाब का इंतज़ार… (⏱ ' + d.timer + 's)')) +
            '</div>' +
            (roundDone ? '<button type="button" class="btn-pri" data-act="d-next">' + (d.qIdx + 1 >= d.qs.length ? '🏆 अंतिम परिणाम देखें ›' : 'अगला सवाल ›') + '</button>' : '') +
          '</div>'
        : '';

      body = '<div style="background:#fff;border:1.5px solid #0794C7;border-radius:12px;padding:9px;margin-bottom:9px;">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;margin-bottom:6px;">' +
            '<span style="display:inline-flex;align-items:center;gap:4px;color:#0794C7;">' + avImg(myId, 'av-xs') + ' ' + myName + ': ' + d.mScore + (d.mStreak >= 2 ? ' 🔥' : '') + '</span>' +
            '<span style="background:#E8F5E9;color:#2E7D32;padding:2px 8px;border-radius:99px;font-size:11px;">' + (d.qIdx + 1) + '/' + d.qs.length + ' · ⏱ ' + d.timer + 's</span>' +
            '<span style="display:inline-flex;align-items:center;gap:4px;color:#D97706;">' + avImg(opId, 'av-xs') + ' ' + opName + ': ' + d.pScore + '</span>' +
          '</div>' +
          '<div style="display:flex;gap:3px;justify-content:center;">' + dots + '</div>' +
        '</div>' +
        preNotice +
        '<div class="q-card"><div class="q-stem" style="font-size:15px;">' + esc(q.q) + '</div><div class="q-src">' + esc(q.src) + '</div></div>' +
        opts +
        afterBox;
    }
  } else {
    const winTxt = d.mScore > d.pScore ? '🏆 ' + myName + ' जीतीं!' : d.pScore > d.mScore ? '🏆 ' + opName + ' जीतीं!' : '🤝 बराबरी का मुक़ाबला!';
    const diffs = d.history.length ? d.history.map((h, i) => {
      const open = d.resOpenIdx === i;
      return '<div style="background:#fff;border-radius:11px;padding:9px;font-size:12px;box-shadow:0 1px 6px rgba(15,23,42,.05);">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:800;"><span>#' + h.qNum + ': ' + esc(h.q) + '</span><button type="button" class="u-btn" style="flex:none;" data-act="d-res-exp" data-i="' + i + '">' + (open ? 'बंद' : 'व्याख्या') + '</button></div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px;font-weight:700;font-size:11.5px;">' +
          '<div style="background:' + (h.mOk ? '#ECFDF5' : '#FFF1F2') + ';color:' + (h.mOk ? '#15803D' : '#BE123C') + ';border-radius:6px;padding:5px 7px;">' + myName + ': ' + (h.mOk ? '✓ ' : '✗ ') + esc(h.mAns) + '</div>' +
          '<div style="background:' + (h.pOk ? '#ECFDF5' : '#FFF1F2') + ';color:' + (h.pOk ? '#15803D' : '#BE123C') + ';border-radius:6px;padding:5px 7px;">' + opName + ': ' + (h.pOk ? '✓ ' : '✗ ') + esc(h.pAns) + '</div>' +
        '</div>' +
        '<div style="margin-top:4px;font-size:11px;font-weight:700;color:#15803D;">सही उत्तर: ' + esc(h.right) + '</div>' +
        (open ? '<div style="margin-top:6px;padding-top:6px;border-top:1px solid #EEF3F7;color:#334155;line-height:1.55;">' + esc(buildExpTimeline(h.exp).lead) + '</div>' : '') +
      '</div>';
    }).join('') : '<div style="background:#fff;border-radius:11px;padding:12px;text-align:center;font-size:12px;color:#64748B;">कोई हल किया हुआ सवाल दर्ज नहीं हुआ</div>';
    body = '<div style="display:flex;flex-direction:column;gap:9px;">' +
      '<div style="background:#FFF8E1;border:2px solid #D97706;border-radius:14px;padding:12px;text-align:center;">' +
        '<div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:5px;">' + avImg(myId, 'av-md') + '<span style="font-size:20px;">🏆</span>' + avImg(opId, 'av-md') + '</div>' +
        '<div style="font-size:17px;font-weight:800;color:#14532D;">' + winTxt + ' · ' + d.mScore + ' — ' + d.pScore + '</div>' +
      '</div>' +
      '<div style="font-size:12.5px;font-weight:800;color:#334155;">किस सवाल पर कौन फँसा?</div>' +
      diffs +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">' +
        '<button type="button" class="btn-pri" data-act="d-lobby">🔁 फिर चैलेंज भेजें</button>' +
        '<button type="button" class="btn-grn" data-act="d-wa-share">📲 WhatsApp भेजें</button>' +
      '</div>' +
    '</div>';
  }

  return '<div class="hd"><div class="hd-l"><button type="button" class="hd-btn" data-act="back-home">←</button>' + avImg(myId, 'av-xs') + '<span class="hd-ttl">1 vs 1 · ' + myName + ' vs ' + opName + '</span>' + avImg(opId, 'av-xs') + '</div></div>' +
    '<div class="body-scr scr" style="padding:11px;">' + body + '</div>';
}

function render() {
  const root = document.getElementById('appRoot');
  if (!root) return '';
  let html = '';
  if (app.view === 'welcome') html = renderWelcomeView();
  else if (app.view === 'home') html = renderHomeView();
  else if (app.view === 'quiz') html = renderQuizView();
  else if (app.view === 'result') html = renderResultView();
  else html = renderDuelView();
  const popupHtml = hasIncomingChallenge() ? renderIncomingModal(app.duel.remoteMatch) : '';
  root.innerHTML = html + popupHtml + (app.toast ? '<div class="toast">' + esc(app.toast) + '</div>' : '');
  return root.innerHTML;
}

function openChapter(chId, mode) {
  const ch = CHAPTER_BANK[chId];
  if (!ch) return;
  const prog = getChProg(chId);
  let ids = [];
  if (mode === 'wrong') ids = ch.questions.filter(q => prog.answers[q.id] !== undefined && prog.answers[q.id] !== q.ans).map(q => q.id);
  else if (mode === 'star') ids = ch.questions.filter(q => prog.stars && prog.stars[q.id]).map(q => q.id);
  if (!ids.length) {
    if (mode === 'wrong' || mode === 'star') {
      showToast(mode === 'wrong' ? 'कोई गलत सवाल बाकी नहीं!' : 'अभी कोई स्टार सवाल नहीं है!');
      return;
    }
    ids = ch.questions.map(q => q.id);
  }
  app.userData.lastChId = chId;
  saveUserData(app.userId, app.userData);
  app.quiz = {
    chId,
    title: ch.title,
    mode,
    qIds: ids,
    cur: mode === 'resume' ? Math.min(prog.curIdx || 0, ids.length - 1) : 0,
    palOpen: false,
    palFilter: 'all',
    showOther: false
  };
  app.view = 'quiz';
  render();
}

function openWaUrl(msg) {
  try {
    if (typeof window !== 'undefined' && window.open && !window.__DISABLE_POPUPS) {
      window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
    }
  } catch (_) {}
  showToast('📲 WhatsApp तैयार: ' + msg);
}

function handleAction(el, ev) {
  const act = el.getAttribute('data-act');
  if (!act) return;

  if (act === 'choose-user') {
    app.userId = el.getAttribute('data-u') === 'p' ? 'p' : 'm';
    saveLS('tgt_gk_active_user_v1', app.userId);
    app.userData = loadUserData(app.userId);
    app.duel.stage = 'lobby';
    app.duel.matchId = '';
    app.view = 'home';
    render();
    sendPresence(true);
    syncLiveState();
    return;
  }
  if (act === 'open-welcome') {
    sendPresence(false, true);
    stopDuelTimer();
    app.duel.stage = 'lobby';
    app.view = 'welcome';
    render(); return;
  }
  if (act === 'back-home') {
    if (app.view === 'duel') {
      if (app.duel.stage === 'waiting') cancelDuelInvite();
      else if (app.duel.stage === 'live') {
        stopDuelTimer();
        app.duel.stage = 'lobby';
        app.duel.matchId = '';
        fbReq('match', 'PATCH', { status: 'ended' });
      }
    }
    stopDuelTimer();
    app.view = 'home';
    render(); return;
  }
  if (act === 'sel-sub') { app.userData.tabId = el.getAttribute('data-v'); saveUserData(app.userId, app.userData); render(); return; }
  if (act === 'tog-ready') { app.userData.onlyReady = !app.userData.onlyReady; saveUserData(app.userId, app.userData); render(); return; }
  if (act === 'tog-paper') { app.userData.paperTint = !app.userData.paperTint; saveUserData(app.userId, app.userData); render(); return; }
  if (act === 'tog-twig') { const cid = el.getAttribute('data-cid'); app.doneTwigCh = app.doneTwigCh === cid ? '' : cid; render(); return; }
  if (act === 'soon-ch') { showToast('📚 "' + el.getAttribute('data-t') + '" जल्द जुड़ेगा!'); return; }
  if (act === 'open-ch') { openChapter(el.getAttribute('data-cid'), el.getAttribute('data-mode') || 'full'); return; }
  if (act === 'trigger-import') { const inp = document.getElementById('jsonImportInput'); if (inp && inp.click) inp.click(); return; }

  // Quiz actions
  if (act === 'q-pick') {
    const ch = CHAPTER_BANK[app.quiz.chId];
    const qId = app.quiz.qIds[app.quiz.cur];
    const prog = getChProg(ch.id);
    prog.answers[qId] = Number(el.getAttribute('data-i'));
    prog.curIdx = app.quiz.cur;
    saveUserData(app.userId, app.userData);
    app.quiz.showOther = false;
    render(); return;
  }
  if (act === 'q-step') {
    const d = Number(el.getAttribute('data-d')) || 1;
    const nxt = Math.max(0, Math.min(app.quiz.qIds.length - 1, app.quiz.cur + d));
    app.quiz.cur = nxt; app.quiz.showOther = false;
    getChProg(app.quiz.chId).curIdx = nxt;
    saveUserData(app.userId, app.userData);
    render(); return;
  }
  if (act === 'q-jump') {
    const nxt = Number(el.getAttribute('data-i')) || 0;
    app.quiz.cur = nxt; app.quiz.palOpen = false; app.quiz.showOther = false;
    getChProg(app.quiz.chId).curIdx = nxt;
    saveUserData(app.userId, app.userData);
    render(); return;
  }
  if (act === 'q-pal-tog' || act === 'q-pal-bg') {
    if (act === 'q-pal-bg' && ev && ev.target && ev.target !== el) return;
    app.quiz.palOpen = !app.quiz.palOpen; render(); return;
  }
  if (act === 'q-pal-f') { app.quiz.palFilter = el.getAttribute('data-v'); render(); return; }
  if (act === 'q-fs') {
    app.userData.fontSize = Math.max(13, Math.min(20, (app.userData.fontSize || 15) + Number(el.getAttribute('data-d'))));
    saveUserData(app.userId, app.userData); render(); return;
  }
  if (act === 'q-star') {
    const qId = app.quiz.qIds[app.quiz.cur];
    const prog = getChProg(app.quiz.chId);
    prog.stars[qId] = !prog.stars[qId];
    saveUserData(app.userId, app.userData); render(); return;
  }
  if (act === 'q-tog-other') { app.quiz.showOther = !app.quiz.showOther; render(); return; }
  if (act === 'q-speak') {
    const ch = CHAPTER_BANK[app.quiz.chId];
    const q = ch.questions.find(x => x.id === app.quiz.qIds[app.quiz.cur]);
    if (q) speakHindi(q.q + ' सही उत्तर: ' + q.opts[q.ans] + '। ' + buildExpTimeline(q.exp).lead);
    return;
  }
  if (act === 'finish-ch') {
    const prog = getChProg(app.quiz.chId);
    prog.finished = true;
    saveUserData(app.userId, app.userData);
    app.quiz.palOpen = false; app.result.openQId = null; app.view = 'result';
    render(); return;
  }

  // Result actions
  if (act === 'r-mark') { app.result.marking = el.getAttribute('data-k'); render(); return; }
  if (act === 'r-tog') { const id = Number(el.getAttribute('data-id')); app.result.openQId = app.result.openQId === id ? null : id; render(); return; }

  // Live 2-Phone Duel actions
  if (act === 'open-duel') {
    stopDuelTimer();
    if ((app.view === 'quiz' || app.view === 'result') && CHAPTER_BANK[app.quiz.chId]) app.duel.scope = app.quiz.chId;
    if (app.duel.stage !== 'live' && app.duel.stage !== 'waiting') app.duel.stage = 'lobby';
    app.view = 'duel';
    render();
    sendPresence(true);
    syncLiveState();
    return;
  }
  if (act === 'd-lobby') { stopDuelTimer(); app.duel.stage = 'lobby'; app.duel.matchId = ''; render(); return; }
  if (act === 'd-scope') { app.duel.scope = el.getAttribute('data-v'); render(); return; }
  if (act === 'd-cnt') { app.duel.count = Number(el.getAttribute('data-v')) || 10; render(); return; }
  if (act === 'd-send-invite' || act === 'd-start') { sendDuelInvite(); return; }
  if (act === 'd-accept') { acceptDuelInvite(); return; }
  if (act === 'd-reject') { rejectDuelInvite(); return; }
  if (act === 'd-cancel') { cancelDuelInvite(); return; }
  if (act === 'd-pick') { handleDuelPick(Number(el.getAttribute('data-i'))); return; }
  if (act === 'd-next') { advanceDuelNext(); return; }
  if (act === 'd-res-exp') { const i = Number(el.getAttribute('data-i')); app.duel.resOpenIdx = app.duel.resOpenIdx === i ? null : i; render(); return; }
  if (act === 'd-wa-invite') {
    const op = app.userId === 'p' ? 'मंजू' : 'प्रियंका';
    openWaUrl(op + ', TGT GK ऐप खोलो — 1 vs 1 मुक़ाबला खेलना है!'); return;
  }
  if (act === 'd-wa-share') {
    const my = app.userId === 'p' ? 'प्रियंका' : 'मंजू', op = app.userId === 'p' ? 'मंजू' : 'प्रियंका';
    openWaUrl('🏆 TGT GK 1 vs 1 परिणाम: ' + my + ' ' + app.duel.mScore + ' — ' + app.duel.pScore + ' ' + op + '!'); return;
  }
}

document.addEventListener('click', (e) => {
  const t = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if (t) handleAction(t, e);
});

const impEl = document.getElementById('jsonImportInput');
if (impEl && impEl.addEventListener) {
  impEl.addEventListener('change', (e) => {
    const files = e.target && e.target.files ? Array.from(e.target.files) : [];
    files.forEach(f => {
      const r = new FileReader();
      r.onload = () => {
        try { importChapterData(JSON.parse(r.result)); render(); }
        catch (err) { showToast('त्रुटि: ' + err.message); }
      };
      r.readAsText(f);
    });
    e.target.value = '';
  });
}

function startLiveSyncLoop() {
  if (!FIREBASE_DB_URL || typeof window === 'undefined' || window.__DISABLE_TIMERS) return;
  if (typeof setInterval === 'function') {
    setInterval(() => {
      if (typeof document === 'undefined' || document.visibilityState !== 'hidden') sendPresence(true);
    }, 6000);
  }
  const stepPoll = async () => {
    await syncLiveState();
    const fast = app.duel.stage === 'waiting' || app.duel.stage === 'live';
    if (typeof setTimeout === 'function') setTimeout(stepPoll, fast ? 850 : 2500);
  };
  if (typeof setTimeout === 'function') setTimeout(stepPoll, 900);
  if (typeof document !== 'undefined' && document.addEventListener) {
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') sendPresence(false, true);
      else { sendPresence(true); syncLiveState(); }
    });
  }
  if (window.addEventListener) {
    window.addEventListener('pagehide', () => sendPresence(false, true));
  }
}

initChapterStore();
const savedUid = safeLS('tgt_gk_active_user_v1', '');
if (savedUid === 'm' || savedUid === 'p') {
  app.userId = savedUid;
  app.userData = loadUserData(savedUid);
  app.view = 'home';
}
render();
if (app.view !== 'welcome' && typeof window !== 'undefined' && !window.__DISABLE_TIMERS) {
  sendPresence(true);
  syncLiveState();
}
startLiveSyncLoop();

if (typeof globalThis !== 'undefined') {
  globalThis.__TGT_APP = {
    app, ROADMAP, CHAPTER_BANK, openChapter, importChapterData, calcMarks, handleAction, render, getChProg, getUserStats,
    startDuelMatch, handleDuelPick, sendPresence, syncLiveState, sendDuelInvite, acceptDuelInvite, rejectDuelInvite, cancelDuelInvite, advanceDuelNext
  };
}
</script>
