const CHAPTER_BANK = {};
function fixMatchHeaderText(h) {
  const s = String(h || '').trim();
  if (/^सूची\s*[-–]?\s*[I1]\s+अनुच्छेद\)$/.test(s)) return 'सूची I (अनुच्छेद)';
  return s;
}

function parseStructuredStem(rawStem, existingMatch) {
  let stem = String(rawStem || '').trim();
  let match = Array.isArray(existingMatch) && existingMatch.length ? existingMatch : null;
  let matchHeaders = ['सूची-I', 'सूची-II'];
  let stmtLines = null;
  let tailLine = '';

  if (!match && stem.includes('| |')) {
    const blocks = stem.split(/\s*\|\s*\|\s*/).map(b => b.trim()).filter(Boolean);
    if (blocks.length >= 3) {
      const lead = blocks[0].replace(/\s*\|\s*$/, '').trim();
      const rows = [];
      let hdrs = null;
      let tail = '';
      for (let i = 1; i < blocks.length; i++) {
        let cells = blocks[i].split('|').map(c => c.trim()).filter(Boolean);
        if (cells.length === 4 && /^[A-Da-d1-4]\.?$/.test(cells[0]) && /^(?:i{1,3}|iv|v|I{1,3}|IV|V|[1-4a-d])\.?$/.test(cells[2])) {
          cells = [cells[0] + ' ' + cells[1], cells[2] + ' ' + cells[3]];
        }
        if (cells.length === 2) {
          const isDataRow = /^(?:[A-Da-d1-4]|\([A-Da-d1-4iIvV]+\))[\.\)\s]/.test(cells[0]);
          if (!hdrs && !isDataRow && rows.length === 0) {
            hdrs = [fixMatchHeaderText(cells[0]), fixMatchHeaderText(cells[1])];
          } else {
            rows.push([cells[0], cells[1]]);
          }
        } else if (cells.length === 1 && i === blocks.length - 1) {
          if (!/^कूट\s*[:：]?$/.test(cells[0])) tail = cells[0];
        }
      }
      if (rows.length >= 2) {
        stem = lead;
        match = rows;
        if (hdrs) matchHeaders = hdrs;
        tailLine = tail;
      }
    }
  } else if (!match && stem.includes('|')) {
    const parts = stem.split(/\s*\|\s*/).map(s => s.trim()).filter(Boolean);
    const rowRx = /^([A-Da-d1-4]\.\s+.+?)\s+((?:i{1,3}|iv|v|I{1,3}|IV|V)\.\s+.+)$/;
    const candidateRows = [];
    let hdr = null;
    for (let i = 1; i < parts.length; i++) {
      const m = parts[i].match(rowRx);
      if (m) {
        candidateRows.push([m[1].trim(), m[2].trim()]);
      } else if (i === 1 && candidateRows.length === 0) {
        hdr = parts[i];
      }
    }
    if (candidateRows.length >= 3) {
      stem = parts[0];
      match = candidateRows;
      if (hdr) {
        const hm = hdr.match(/^(.+?)\s+(अनुच्छेद|विषय|सूची\s*[-–]?\s*II.*)$/);
        if (hm) matchHeaders = [fixMatchHeaderText(hm[1]), fixMatchHeaderText(hm[2])];
      }
    } else if (parts.length >= 2) {
      stem = parts[0];
      const rest = parts.slice(1).filter(p => !/^कथन[ः:]?$/.test(p));
      const last = rest[rest.length - 1] || '';
      if (rest.length >= 2 && /^(?:उपर्युक्त|नीचे\s+दिए|नीचे\s+दिये|सही\s+कूट|सही\s+विकल्प|कूट)/.test(last)) {
        stmtLines = rest.slice(0, -1);
        tailLine = /^कूट\s*[:：]?$/.test(last) ? '' : last;
      } else {
        stmtLines = rest;
      }
    }
  } else if (stem.includes('\n')) {
    const parts = stem.split(/\n+/).map(s => s.trim()).filter(Boolean);
    if (parts.length >= 2) {
      stem = parts[0];
      const rest = parts.slice(1);
      const last = rest[rest.length - 1] || '';
      if (rest.length >= 2 && /^(?:उपर्युक्त|नीचे\s+दिए|नीचे\s+दिये|सही\s+कूट|सही\s+विकल्प|कूट)/.test(last)) {
        stmtLines = rest.slice(0, -1);
        tailLine = /^कूट\s*[:：]?$/.test(last) ? '' : last;
      } else {
        stmtLines = rest;
      }
    }
  }
  return { stem, match, matchHeaders, stmtLines, tailLine };
}

function normalizeRawChapter(data) {
  if (!data || !data.id || !data.title || !Array.isArray(data.questions) || !data.questions.length) {
    throw new Error('अमान्य पाठ फ़ाइल: id, title या questions गायब हैं।');
  }
  const qs = data.questions.map((q, idx) => {
    if (!Array.isArray(q.opts) || q.opts.length !== 4 || typeof q.ans !== 'number') {
      throw new Error('सवाल #' + (idx + 1) + ' में 4 विकल्प और ans होना आवश्यक है।');
    }
    let rawQ = String(q.q || '').trim();
    let stem = rawQ, src = q.src ? String(q.src) : '';
    if (!src) {
      const m = rawQ.match(/\s*\[((?:किताब|PYQ)[^\]]*)\]\s*$/);
      if (m) { stem = rawQ.slice(0, m.index).trim(); src = '(' + m[1].trim() + ')'; }
      else { src = '(किताब: ' + String(data.pages || '') + ')'; }
    }
    const cleanExp = String(q.exp || '')
      .replace(/\u26a0\ufe0f?\s*\u0915\u093f\u0924\u093e\u092c \u0938\u0941\u0927\u093e\u0930\s*:?|\u0915\u093f\u0924\u093e\u092c \u0938\u0941\u0927\u093e\u0930\s*:?/g, 'सटीक तथ्य:')
      .replace(/\u092f\u0939 \u092e\u092e\u094d\u092e\u0940 \u0915\u0940 \u0905\u092a\u0928\u0940\s+/g, 'यह अपनी ')
      .replace(/\u092e\u092e\u094d\u092e\u0940,\s*\u0907\u0928 \u0924\u0940\u0928\u094b\u0902/g, 'इन तीनों')
      .replace(/\u092e\u092e\u094d\u092e\u0940 \u0915\u094b \u0938\u094d\u092a\u0937\u094d\u091f \u0909\u0924\u094d\u0924\u0930 \u0938\u093f\u0916\u093e\u0928\u0947 \u0939\u0947\u0924\u0941\s+/g, 'स्पष्ट उत्तर हेतु ')
      .replace(/\u26a0\ufe0f?/g, '').trim();
    const parsed = parseStructuredStem(stem, q.match);
    return {
      id: q.id != null ? q.id : idx + 1,
      type: q.type || 'BOOK',
      fmt: q.fmt || 'Direct',
      q: parsed.stem,
      stmtLines: parsed.stmtLines,
      tailLine: parsed.tailLine,
      src: src,
      opts: q.opts.map(String),
      ans: q.ans,
      exp: cleanExp,
      trick: String(q.trick || '').replace(/\u26a0\ufe0f?/g, '').trim(),
      vip: !!q.vip,
      match: parsed.match,
      matchHeaders: parsed.matchHeaders
    };
  });
  return {
    id: String(data.id),
    num: Number(data.num || 0),
    subject: String(data.subject || ''),
    chapter_code: String(data.chapter_code || ''),
    title: String(data.title).trim(),
    pages: String(data.pages || ''),
    total_questions: qs.length,
    questions: qs
  };
}

function normTitle(t) {
  return String(t || '').replace(/\s+/g, '').replace(/[()\-–।]/g, '').toLowerCase();

function subjectIdFromText(subj) {
  const s = String(subj || '');
  if (s.includes('पर्यावरण')) return 'env';
  if (s.includes('राज') || s.includes('संविधान')) return 'pol';
  if (s.includes('इतिहास')) return 'his';
  if (s.includes('भूगोल') || s.includes('जनगणना')) return 'geo';
  if (s.includes('अर्थ')) return 'eco';
  if (s.includes('विज्ञान') || s.includes('स्वास्थ्य')) return 'sci';
  if (s.includes('संस्कृति') || s.includes('स्टैटिक')) return 'sta';
  return 'up';
}

function attachChaptersToRoadmap() {
  ROADMAP.forEach(s => s.chapters.forEach(c => { if (!c._baseChId) c._baseChId = c.chId || ''; c.liveId = ''; }));
  Object.values(CHAPTER_BANK).forEach(ch => {
    let matched = null;
    for (const s of ROADMAP) {
      for (const c of s.chapters) {
        if ((c._baseChId && c._baseChId === ch.id) || normTitle(c.t) === normTitle(ch.title)) {
          matched = c; break;
        }
      }
      if (matched) break;
    }
    if (matched) {
      matched.liveId = ch.id;
      matched.q = ch.total_questions;
      if (ch.pages) matched.p = ch.pages.replace(/\s*\(PDF[^)]*\)/g, '').trim();
    } else {
      const sid = subjectIdFromText(ch.subject);
      const sub = ROADMAP.find(s => s.id === sid) || ROADMAP[6];
      sub.chapters.push({ t: ch.title, p: ch.pages || 'नया पाठ', est: ch.total_questions, q: ch.total_questions, exam: 'both', liveId: ch.id, _baseChId: ch.id });
    }
  });
}

function getChProg(chId) {

  if (!p.duelSkips) p.duelSkips = {};

function orderedChapterIds() {
  const seen = new Set();
  const out = [];
  ROADMAP.forEach(s => s.chapters.forEach(c => {
    if (c.liveId && CHAPTER_BANK[c.liveId] && !seen.has(c.liveId)) {
      seen.add(c.liveId);
      out.push(c.liveId);
    }
  }));
  Object.keys(CHAPTER_BANK).forEach(cid => {
    if (!seen.has(cid)) { seen.add(cid); out.push(cid); }
  });
  return out;
}

function getVaultItems(kind, chFilter) {
  const out = [];
  const f = chFilter || 'all';
  orderedChapterIds().forEach(cid => {
    if (f !== 'all' && f !== cid) return;
    const ch = CHAPTER_BANK[cid];
    if (!ch) return;
    const prog = getChProg(cid);
    ch.questions.forEach(q => {
      const sAns = prog.answers[q.id];
      const dWrong = prog.duelWrongs[q.id];
      const dSkip = prog.duelSkips[q.id];
      if (kind === 'star') {
        if (prog.stars && prog.stars[q.id]) {
          const fromDuel = prog.starFrom && prog.starFrom[q.id] === 'duel';
          out.push({ key: cid + ':' + q.id, chId: cid, chTitle: ch.title, ch, q, from: fromDuel ? '1v1 मुक़ाबला' : 'पाठ टेस्ट', isDuel: fromDuel });
        }
      } else if (kind === 'wrong') {
        const soloWr = (sAns !== undefined && sAns >= 0 && sAns !== q.ans);
        const duelWr = (dWrong !== undefined && dWrong >= 0 && dWrong !== q.ans);
        if (soloWr || duelWr) {
          const wPick = duelWr ? dWrong : sAns;
          out.push({ key: cid + ':' + q.id, chId: cid, chTitle: ch.title, ch, q, wrongPick: wPick, from: duelWr ? '1v1 मुक़ाबला' : 'पाठ टेस्ट', isDuel: !!duelWr });
        }
      } else if (kind === 'skip') {
        const soloSk = (sAns === -1);
        const duelSk = (!!dSkip && (sAns === undefined || sAns === -1));
        if (soloSk || duelSk) {
          out.push({ key: cid + ':' + q.id, chId: cid, chTitle: ch.title, ch, q, from: duelSk ? '1v1 मुक़ाबला' : 'पाठ टेस्ट', isDuel: !!duelSk });
        }
      }
    });
  });
  return out;
}

function getVaultCounts() {
  return {
    star: getVaultItems('star', 'all').length,
    wrong: getVaultItems('wrong', 'all').length,
    skip: getVaultItems('skip', 'all').length,
    hist: Array.isArray(app.userData.duelHistory) ? app.userData.duelHistory.length : 0
  };
}

function getDuelScopeCounts(scope) {
  if (scope && String(scope).startsWith('vault_')) {
    const n = Array.isArray(app.duel.customRefs) ? app.duel.customRefs.length : 0;
    return { total: n, unseen: n, seen: 0 };
  }
  if (scope === 'mix') {
    let total = 0, unseen = 0;
    Object.keys(CHAPTER_BANK).forEach(cid => {
      const ch = CHAPTER_BANK[cid];
      const p = getChProg(cid);
      ch.questions.forEach(q => {
        total++;
        if (!p.duelSeen[q.id]) unseen++;
      });
    });
    return { total, unseen, seen: total - unseen };
  }
  const ch = CHAPTER_BANK[scope];
  if (!ch) return { total: 0, unseen: 0, seen: 0 };
  const p = getChProg(scope);
  let unseen = 0;
  ch.questions.forEach(q => {
    if (!p.duelSeen[q.id]) unseen++;
  });
  return { total: ch.questions.length, unseen, seen: ch.questions.length - unseen };
}

function resetDuelScopePool(scope) {
  if (scope === 'mix') {
    Object.keys(CHAPTER_BANK).forEach(cid => { getChProg(cid).duelSeen = {}; });
  } else if (CHAPTER_BANK[scope]) {
    getChProg(scope).duelSeen = {};
  }
  saveUserData(app.userId, app.userData);
}

function getQuizItem(idx) {
  const qz = app.quiz;
  if (qz.isVault && Array.isArray(qz.vaultRefs)) {
    const ref = qz.vaultRefs[idx];
    const ch = ref && CHAPTER_BANK[ref.chId];
    const q = ch ? ch.questions.find(x => x.id === ref.qId) : null;
    return q ? { ch, chId: ch.id, q } : null;
  }
  const ch = CHAPTER_BANK[qz.chId];
  const qId = qz.qIds[idx];
  const q = ch ? ch.questions.find(x => x.id === qId) : null;
  return q ? { ch, chId: ch.id, q } : null;
}

function getQuizLength() {
  return app.quiz.isVault ? (app.quiz.vaultRefs ? app.quiz.vaultRefs.length : 0) : (app.quiz.qIds ? app.quiz.qIds.length : 0);
}

function getQuizPicked(idx) {
  if (app.quiz.isVault) return app.quiz.vaultAns[idx];
  if (app.quiz.useSessionAns) return app.quiz.sessionAns[idx];
  const it = getQuizItem(idx);
  return it ? getChProg(it.chId).answers[it.q.id] : undefined;
}

function openVaultQuiz(kind, chFilter) {
  const items = getVaultItems(kind, chFilter || 'all');
  if (!items.length) {
    showToast('अभी इस सूची में कोई सवाल नहीं है!');

  app.quiz = {

function launchVaultDuel(kind, chFilter) {
  const items = getVaultItems(kind, chFilter || 'all');

  app.duel.customTitle = ttl;

  app.duel.count = Math.min(30, items.length);

  app.duel.stage = 'menu';

  syncLiveState();
}

function getUserStats(uid) {
  const ud = uid === app.userId ? app.userData : loadUserData(uid);
  let doneCh = 0, seen = 0, attempted = 0, ok = 0;
  Object.keys(CHAPTER_BANK).forEach(cid => {
    const p = ud.progress[cid];
    if (!p) return;
    const ansMap = p.answers || {};
    const keys = Object.keys(ansMap);
    if (keys.length >= CHAPTER_BANK[cid].questions.length || p.finished) doneCh++;
    CHAPTER_BANK[cid].questions.forEach(q => {
      const val = ansMap[q.id];
      if (val !== undefined) {
        seen++;
        if (val >= 0) {
          attempted++;
          if (val === q.ans) ok++;
        }
      }
    });
  });
  const acc = attempted ? Math.round((ok / attempted) * 100) : 0;
  return { doneCh, seen, attempted, ok, acc };
}

function roadmapTotals() {
  let tot = 0, rdy = 0, qTot = 0;
  ROADMAP.forEach(s => s.chapters.forEach(c => {
    tot++;
    if (c.liveId && CHAPTER_BANK[c.liveId]) { rdy++; qTot += CHAPTER_BANK[c.liveId].total_questions; }
  }));
  return { tot, rdy, qTot };
}

function splitReadablePoints(rawExp) {
  const clean = String(rawExp || '')
    .replace(/\u26a0\ufe0f?\s*\u0915\u093f\u0924\u093e\u092c \u0938\u0941\u0927\u093e\u0930\s*:?|\u0915\u093f\u0924\u093e\u092c \u0938\u0941\u0927\u093e\u0930\s*:?/g, 'सटीक तथ्य:')
    .replace(/\u26a0\ufe0f?/g, '').trim();
  return clean
    .replace(/([।!])\s+/g, '$1\n')
    .replace(/;\s+/g, '\n')
    .replace(/सही मिलान:\s*/g, '\nसही मिलान: ')
    .split(/\n+/)
    .map(s => s.replace(/^[•\-]\s*/, '').trim())
    .filter(Boolean);
}

function highlightHindiFacts(rawStr) {
  const str = String(rawStr || '');
  const rx = /(^[^:\n]{3,36}:|'[^'\n]{2,45}'|"[^"\n]{2,45}"|अनुच्छेद\s*\d+[A-Za-z\u0900-\u097F\-]*|अनु\.\s*\d+[A-Za-z\u0900-\u097F\-]*|\d+\s*(?:लाख|मिलियन|करोड़|सीटें?|सीट|प्रतिशत|%|सदस्य|वर्ष|साल|दिन|माह|वाँ|वें|वीं)|\d{1,2}\s*(?:जनवरी|फरवरी|मार्च|अप्रैल|मई|जून|जुलाई|अगस्त|सितंबर|अक्टूबर|नवंबर|दिसंबर)|(?:1[789]\d{2}|20\d{2}))/g;
  let out = '', last = 0, m;
  while ((m = rx.exec(str)) !== null) {
    if (m.index > last) out += esc(str.slice(last, m.index));
    out += '<b class="kh">' + esc(m[0]) + '</b>';
    last = rx.lastIndex;
    if (m[0].length === 0) rx.lastIndex++;
  }
  if (last < str.length) out += esc(str.slice(last));
  return out;
}

function extractPageLabel(q, ch) {
  const s = String((q && q.src) || '');
  const m = s.match(/प\.\s*([0-9\u0966-\u096F\u2013\-, ]+)/);
  if (m && m[1].trim()) return 'पन्ना ' + m[1].trim().replace(/[,\s]+$/, '');
  if (s.includes('किताब में नहीं')) return 'व्याख्या';
  const cp = ch && ch.pages ? String(ch.pages).replace(/\s*\(PDF[^)]*\)/g, '').replace(/^प\.\s*/, '').trim() : '';
  return cp ? 'पन्ना ' + cp : 'व्याख्या';
}

function buildExpTimeline(rawExp) {
  const parts = splitReadablePoints(rawExp);
  const lead = parts.length ? parts[0] : '';
  const points = parts.slice(1);
  return { lead, points };
}

function calcMarks(right, wrong, total, mode) {
  if (mode === 'up') return { big: (right * 3 - wrong) + ' / ' + (total * 3) + ' अंक', sub: 'UP TGT (+3 / −1) · ' + right + '×3 − ' + wrong + '×1' };
  if (mode === 'delhi') return { big: (right - wrong * 0.25) + ' / ' + total + ' अंक', sub: 'दिल्ली (+1 / −0.25) · ' + right + ' − ' + (wrong * 0.25) };
  const pct = total ? Math.round((right / total) * 100) : 0;
  return { big: right + ' / ' + total + ' सही', sub: pct + '% सटीकता · शानदार अभ्यास!' };
}

/* ================= JOD 2028 EXPERIMENT (JOD LAB) 1v1 CHALLENGE ENGINE ================= */
function duelPid() {
  if (app.duel.pid) return app.duel.pid;
  let id = safeLS('tgt_gk_duel_pid_v2', '');
  if (!id || typeof id !== 'string') {
    id = 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
    saveLS('tgt_gk_duel_pid_v2', id);
  }
  app.duel.pid = id;
  return id;
}

function defaultPlayerName() {
  const saved = safeLS('tgt_gk_duel_name_' + app.userId, '');
  if (saved && String(saved).trim()) return String(saved).trim().slice(0, 16);
  return app.userId === 'p' ? 'प्रियंका' : 'मंजू';
}

function duelPoolMax(scope) {
  return getDuelScopeCounts(scope).unseen;
}

function duelEffCount() {
  const mx = duelPoolMax(app.duel.scope);
  if (mx <= 0) return 0;
  if (app.duel.allScope) return mx;
  const n = Math.round(Number(app.duel.count) || 30);
  return Math.max(1, Math.min(mx, n));
}

function buildDuelRefs(scope, count) {
  let pool = [];
  if (scope && String(scope).startsWith('vault_')) {
    pool = Array.isArray(app.duel.customRefs) ? app.duel.customRefs.slice() : [];
  } else if (scope === 'mix') {
    orderedChapterIds().forEach(cid => {
      const p = getChProg(cid);
      CHAPTER_BANK[cid].questions.forEach(q => {
        if (!p.duelSeen[q.id]) pool.push({ chId: cid, qId: q.id });
      });
    });
  } else if (CHAPTER_BANK[scope]) {
    const p = getChProg(scope);
    CHAPTER_BANK[scope].questions.forEach(q => {
      if (!p.duelSeen[q.id]) pool.push({ chId: scope, qId: q.id });
    });
  }
  if (!pool.length) return [];
  const arr = pool.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  const want = Math.max(1, Math.min(Number(count) || 30, arr.length));
  return arr.slice(0, want);
}

function markDuelQuestionSeen(qObj) {
  if (!qObj) return;
  if (String(app.duel.scope || '').startsWith('vault_')) return;
  const cid = qObj._chId || (CHAPTER_BANK[app.duel.scope] ? app.duel.scope : '');
  if (cid && CHAPTER_BANK[cid]) {
    getChProg(cid).duelSeen[qObj.id] = 1;
  }
}

function formatHindiStamp(ts) {
  try {
    const d = new Date(ts || Date.now());
    const months = ['जनवरी','फरवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितंबर','अक्टूबर','नवंबर','दिसंबर'];
    const h24 = d.getHours();
    const mins = String(d.getMinutes()).padStart(2, '0');
    const period = h24 < 12 ? 'सुबह' : (h24 < 17 ? 'दोपहर' : 'शाम');
    const h12 = (h24 % 12) || 12;
    return d.getDate() + ' ' + months[d.getMonth()] + ' · ' + period + ' ' + h12 + ':' + mins;
  } catch (_) {
    return 'आज';
  }
}

function currentDuelMatchId() {
  const d = app.duel;
  return d.code ? ('rm_' + d.code + '_r' + Number(d.round || 0)) : ('solo_' + Number(d.startedAt || 1) + '_r' + Number(d.round || 0));
}

function ansOfMap(ansMap, idx) {
  if (!ansMap || typeof ansMap !== 'object') return undefined;
  if (ansMap[idx] !== undefined && ansMap[idx] !== null) return Number(ansMap[idx]);
  if (ansMap[String(idx)] !== undefined && ansMap[String(idx)] !== null) return Number(ansMap[String(idx)]);
  return undefined;
}

function upsertDuelHistoryFromCurrent() {
  const d = app.duel;
  if (!d.qs || !d.qs.length) return null;
  const mid = currentDuelMatchId();
  if (!Array.isArray(app.userData.duelHistory)) app.userData.duelHistory = [];
  const existIdx = app.userData.duelHistory.findIndex(x => x && x.id === mid);
  const existing = existIdx >= 0 ? app.userData.duelHistory[existIdx] : null;

  const myS = calcMyDuelStats();
  const myMs = d.finishedMs || d.elapsedMs || (existing && existing.me ? existing.me.ms : 0) || 0;
  const curName = d.customName || defaultPlayerName();
  const meP = duelMePlayer() || { name: curName, who: app.userId };
  const opP = duelOppPlayer();
  const opDefaultName = app.userId === 'p' ? 'मंजू' : 'प्रियंका';
  const opId = app.userId === 'p' ? 'm' : 'p';

  const scopeTitle = (d.room && d.room.scopeTitle)
    || (String(d.scope || '').startsWith('vault_') ? (d.customTitle || 'मेरे सवाल') : (d.scope === 'mix' ? 'सभी मिक्स सवाल' : (CHAPTER_BANK[d.scope]?.title || 'पाठ')));

  const rec = {
    id: mid,
    ts: existing ? existing.ts : Date.now(),
    dateStr: existing ? existing.dateStr : formatHindiStamp(Date.now()),
    code: d.code || '',
    round: Number(d.round || 0),
    scope: d.scope,
    title: scopeTitle,
    solo: !!d.soloPractice,
    total: d.qs.length,
    qRefs: d.qs.map(q => ({ chId: q._chId || (CHAPTER_BANK[d.scope] ? d.scope : 'ch01'), qId: q.id })),
    me: {
      name: meP.name || curName,
      who: app.userId,
      pts: myS.pts,
      ok: myS.ok,
      wr: myS.wr,
      sk: myS.sk,
      k: myS.k,
      ms: myMs,
      ans: Object.assign({}, d.myAns)
    },
    op: opP ? {
      name: opP.name || opDefaultName,
      who: opP.who || opId,
      pts: Number(opP.pts || 0),
      ok: Number(opP.ok || 0),
      wr: Number(opP.wr || 0),
      sk: Number(opP.sk || 0),
      k: Number(opP.k || 0),
      ms: Number(opP.ms || 0),
      fin: !!opP.fin,
      ans: Object.assign({}, opP.ans || {})
    } : (existing ? existing.op : null)
  };

  if (existIdx >= 0) {
    app.userData.duelHistory[existIdx] = rec;
  } else {
    app.userData.duelHistory.unshift(rec);
    if (app.userData.duelHistory.length > 80) app.userData.duelHistory.length = 80;
  }
  saveUserData(app.userId, app.userData);
  return rec;
}

function getDuelRecordById(mid) {
  const list = Array.isArray(app.userData.duelHistory) ? app.userData.duelHistory : [];
  if (mid) {
    const found = list.find(x => x && x.id === mid);
    if (found) return found;
  }
  if (app.duel.qs && app.duel.qs.length && (!mid || mid === currentDuelMatchId())) {
    return upsertDuelHistoryFromCurrent();
  }
  return list[0] || null;
}

function verdictOfRecord(rec) {
  if (!rec) return ['—', 'draw'];
  const myS = rec.me || { pts: 0, ms: 0, name: defaultPlayerName() };
  const op = rec.op;
  if (!op || rec.solo) return ['⚡ अभ्यास पूरा! (' + myS.pts + ' अंक)', 'win'];
  if (!op.fin) return ['⏳ ' + (op.name || 'दोस्त') + ' अभी खेल रही हैं… (' + (op.k || 0) + '/' + rec.total + ')', 'wait'];
  const mp = Number(myS.pts || 0), opp = Number(op.pts || 0);
  const myNm = myS.name || defaultPlayerName();
  const opNm = op.name || 'दोस्त';
  if (mp !== opp) return mp > opp ? ['🏆 ' + myNm + ' जीतीं!', 'win'] : ['🏆 ' + opNm + ' जीतीं — अगली बार पक्का! 💪', 'lose'];
  if (myS.ms && op.ms && myS.ms !== op.ms) {
    return myS.ms < op.ms ? ['🏆 बराबर अंक — कम समय से ' + myNm + ' जीतीं!', 'win'] : ['🏆 बराबर अंक — कम समय से ' + opNm + ' जीतीं!', 'lose'];
  }
  return ['🤝 बराबरी का शानदार मुक़ाबला!', 'draw'];
}

function buildDuelPool(scope, count) {
  return buildDuelRefs(scope, count).map(r => {
    const ch = CHAPTER_BANK[r.chId];
    return ch ? ch.questions.find(q => q.id === r.qId) : null;
  }).filter(Boolean);
}

function resolveDuelQuestions(qRefs) {
  const list = Array.isArray(qRefs) ? qRefs : Object.values(qRefs || {});
  return list.map(r => {
    const ch = r && CHAPTER_BANK[r.chId];
    if (!ch) return null;
    const found = ch.questions.find(q => q.id === r.qId);
    return found ? Object.assign({ _chId: r.chId }, found) : null;
  }).filter(Boolean);
}

function serverNow() {
  return Date.now() + (app.duel.serverOffset || 0);
}

function fmtDuelClock(ms) {
  const s = Math.max(0, Math.floor((ms || 0) / 1000));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
}

function fmtDuelDur(ms) {
  if (!ms || ms <= 0) return '—';
  const totTenths = Math.round(ms / 100);
  const s = totTenths / 10;
  if (s < 60) return s.toFixed(1) + 's';
  const m = Math.floor(s / 60);
  const rem = (s - m * 60).toFixed(0).padStart(2, '0');
  return m + ':' + rem;
}

function fbUrl(subPath) {
  const base = String(FIREBASE_DB_URL || '').replace(/\/+$/, '');
  return base + (subPath ? '/' + subPath.replace(/^\/+/, '') : '') + '.json';
}

async function fbReq(subPath, method, bodyObj, keepalive) {
  if (!FIREBASE_DB_URL || typeof fetch !== 'function') return null;
  try {
    const opts = { method: method || 'GET' };
    if (keepalive) opts.keepalive = true;
    if (bodyObj !== undefined) {
      opts.headers = { 'Content-Type': 'application/json' };
      opts.body = JSON.stringify(bodyObj);
    }
    const resp = await fetch(fbUrl(subPath), opts);
    if (!resp.ok) {
      app.duel.netOk = false;
      return null;
    }
    app.duel.netOk = true;
    const txt = await resp.text();
    return txt ? JSON.parse(txt) : null;
  } catch (_) {
    app.duel.netOk = false;
    return null;
  }
}

async function sendPresence(isOnline, keepalive) {
  if (!FIREBASE_DB_URL || app.view === 'welcome') return null;
  const uid = app.userId === 'p' ? 'p' : 'm';
  const t0 = Date.now();
  const res = await fbReq('presence/' + uid, 'PUT', {
    ts: { '.sv': 'timestamp' },
    online: isOnline !== false,
    pid: duelPid()
  }, keepalive);
  const t1 = Date.now();
  if (res && typeof res.ts === 'number') {
    app.duel.serverOffset = res.ts - Math.round((t0 + t1) / 2);
  }
  return res;
}

function setNestedAt(obj, pathStr, val) {
  const ks = String(pathStr || '').split('/').filter(Boolean);
  if (!ks.length) return val;
  const root = (obj && typeof obj === 'object') ? obj : {};
  let cur = root;
  for (let i = 0; i < ks.length - 1; i++) {
    if (!cur[ks[i]] || typeof cur[ks[i]] !== 'object') cur[ks[i]] = {};
    cur = cur[ks[i]];
  }
  if (val === null) delete cur[ks[ks.length - 1]];
  else cur[ks[ks.length - 1]] = val;
  return root;
}

function duelPlayers() {
  const p = (app.duel.room && app.duel.room.p) || {};
  return Object.keys(p)
    .filter(id => p[id] && typeof p[id] === 'object')
    .map(id => Object.assign({ id }, p[id]))
    .sort((a, b) => (a.role === 'host' ? 0 : 1) - (b.role === 'host' ? 0 : 1));
}

function duelMePlayer() {
  const pid = duelPid();
  return duelPlayers().find(x => x.id === pid) || null;
}

function duelOppPlayer() {
  const pid = duelPid();
  return duelPlayers().find(x => x.id !== pid) || null;
}

function isDuelHost() {
  const m = duelMePlayer();
  return !!(m && m.role === 'host');
}

function calcMyDuelStats() {
  const d = app.duel;
  let ok = 0, wr = 0, sk = 0, k = 0;
  d.qs.forEach((q, idx) => {
    const a = d.myAns[idx];
    if (a === undefined) return;
    k++;
    if (a === -1) sk++;
    else if (a === q.ans) ok++;
    else wr++;
  });
  const pts = ok * 3 - wr * 1;
  return { k, ok, wr, sk, pts };
}

function playerAvatarHtml(pObj, cls) {
  const nm = String((pObj && pObj.name) || '').trim();
  const who = pObj && pObj.who;
  if (nm === 'मंजू' || (who === 'm' && (!nm || nm === 'मंजू'))) return avImg('m', cls || 'av-xs');
  if (nm === 'प्रियंका' || (who === 'p' && (!nm || nm === 'प्रियंका'))) return avImg('p', cls || 'av-xs');
  const ch = nm ? Array.from(nm)[0].toUpperCase() : '?';
  return '<span class="bav-init">' + esc(ch) + '</span>';
}

function renderBattleBoxesHtml() {
  const d = app.duel;
  const n = Math.max(1, d.qs.length || 30);
  const myS = calcMyDuelStats();
  const meP = duelMePlayer() || { name: d.customName || defaultPlayerName(), who: app.userId };
  const opP = duelOppPlayer();
  const box = (pObj, pts, k, isYou, isFin) =>
    '<div class="bbox">' +
      '<div class="bname">' +
        playerAvatarHtml(pObj, 'av-xs') +
        '<b>' + esc((pObj && pObj.name) || 'खिलाड़ी') + '</b>' +
        (isYou ? '<span class="byou">YOU</span>' : '') +
        (isFin ? '<span class="bfin">✓ पूरा</span>' : '') +
      '</div>' +
      '<div class="bpts">' +
        '<b class="tnum">' + pts + '</b><span>अंक</span>' +
        '<span class="bk-cnt tnum">' + k + '/' + n + '</span>' +
      '</div>' +
      '<div class="bbar"><i style="width:' + Math.min(100, Math.round((k / n) * 100)) + '%"></i></div>' +
    '</div>';

  const rightBox = opP
    ? box(opP, Number(opP.pts || 0), Number(opP.k || 0), false, !!opP.fin)
    : '<div class="bbox" style="display:flex;flex-direction:column;justify-content:center;align-items:center;color:#78716C;font-size:11.5px;font-weight:700;text-align:center;">' +
        (d.soloPractice ? '⚡ अकेला अभ्यास मोड' : 'दोस्त जुड़ने का इंतज़ार…') +
      '</div>';

  return box(meP, myS.pts, myS.k, true, !!d.fin) + '<div class="bvs">⚡</div>' + rightBox;
}

function updateLiveBattleDomOnly() {
  if (typeof document === 'undefined') return false;
  const root = document.getElementById('appRoot');
  const bEl = root && root.querySelector ? root.querySelector('#duelBattleBar') : null;
  if (!bEl) return false;
  bEl.innerHTML = renderBattleBoxesHtml();
  return true;
}

function hasIncomingChallenge() {
  if (app.view === 'welcome') return false;
  const d = app.duel;
  if (app.view === 'duel' && (d.stage === 'lobby' || d.stage === 'count' || d.stage === 'live')) return false;
  const inv = d.activeInvite;
  if (!inv || !inv.code || inv.status !== 'wait') return false;
  if (inv.fromPid && inv.fromPid === duelPid()) return false;
  if (inv.code === d.code || inv.code === d.lastRejectedId) return false;
  if (typeof inv.createdAt === 'number' && (serverNow() - inv.createdAt) > 180000) return false;
  return true;
}

function hasFocusedInputInRoot() {
  if (typeof document === 'undefined' || !document.activeElement) return false;
  const tag = String(document.activeElement.tagName || '').toUpperCase();
  if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') return false;
  const root = document.getElementById('appRoot');
  return !!(root && root.contains && root.contains(document.activeElement));
}

function startDuelStopwatch() {
  stopDuelTimer();
  if (typeof setInterval === 'function' && typeof window !== 'undefined' && !window.__DISABLE_TIMERS) {
    app.duel.timerId = setInterval(() => {
      const d = app.duel;
      if (app.view !== 'duel' || d.stage !== 'live') return;
      d.elapsedMs = Math.max(0, Date.now() - (d.startedAt || Date.now()));
      if (typeof document !== 'undefined') {
        const root = document.getElementById('appRoot');
        const clk = root && root.querySelector ? root.querySelector('#duelClkEl') : null;
        if (clk) clk.textContent = fmtDuelClock(d.elapsedMs);
      }
    }, 500);
  }
}

function runDuelCountdown() {
  const d = app.duel;
  const goAt = (d.room && d.room.go) ? Number(d.room.go) : (serverNow() + 3000);
  if (typeof window === 'undefined' || window.__DISABLE_TIMERS) {
    beginDuelLivePlay();
    return;
  }
  const tick = () => {
    if (d.stage !== 'count') return;
    const left = goAt - serverNow();
    if (typeof document !== 'undefined') {
      const root = document.getElementById('appRoot');
      const el = root && root.querySelector ? root.querySelector('#duelCountNum') : null;
      if (el) el.textContent = left > 2000 ? '3' : (left > 1000 ? '2' : (left > 0 ? '1' : 'GO!'));
    }
    if (left <= 0) {
      beginDuelLivePlay();
      return;
    }
    setTimeout(tick, 60);
  };
  tick();
}

function beginDuelLivePlay() {
  const d = app.duel;
  const r = d.room;
  const refs = (r && r.qRefs) ? r.qRefs : d.qRefs;
  const qs = resolveDuelQuestions(refs);
  if (qs.length) d.qs = qs;
  if (!d.qs.length) {
    d.qs = buildDuelPool(d.scope, duelEffCount());
  }
  d.round = (r && r.round) ? Number(r.round) : d.round;
  d.qIdx = 0;
  d.myAns = {};
  d.startedAt = Date.now();
  d.elapsedMs = 0;
  d.finishedMs = 0;
  d.fin = 0;
  d.palOpen = false;
  d.palFilter = 'all';
  d.leaveOpen = false;
  d.finishConfirmOpen = false;
  d.resOpenIdx = null;
  d.stage = 'live';
  app.view = 'duel';
  startDuelStopwatch();
  render();
  pushMyDuelProgress(false);
}

function onDuelRoomUpdate() {
  const d = app.duel;
  const r = d.room;
  if (!r) {
    if (d.stage === 'lobby' || d.stage === 'count') {
      stopDuelRoomStream();
      d.stage = 'menu';
      d.code = '';
      showToast('Room बंद हो गया है');
    }
    return;
  }
  if (r.scope) d.scope = r.scope;
  if (r.count) d.count = Number(r.count);

  if (r.st === 'go' && d.stage === 'lobby') {
    d.round = Number(r.round || 0);
    d.stage = 'count';
    app.view = 'duel';
    render();
    runDuelCountdown();
    return;
  }
  if (r.st === 'wait' && (d.stage === 'result' || d.stage === 'live') && Number(r.round || 0) !== Number(d.round || 0)) {
    stopDuelTimer();
    if (d.qs && d.qs.length) {
      d.qs.forEach(markDuelQuestionSeen);
      upsertDuelHistoryFromCurrent();
    }
    d.round = Number(r.round || 0);
    d.myAns = {};
    d.fin = 0;
    d.stage = 'lobby';
    if (r.qRefs) d.qs = resolveDuelQuestions(r.qRefs);
    app.view = 'duel';
    render();
    showToast('⚔️ नया राउंड तैयार है!');
    return;
  }
  if (d.stage === 'result') {
    upsertDuelHistoryFromCurrent();
  }
  if (app.view === 'duel') {
    if (d.stage === 'live') {
      updateLiveBattleDomOnly();
    } else if (d.stage === 'lobby' || d.stage === 'result') {
      if (!hasFocusedInputInRoot()) render();
    }
  } else if ((app.view === 'duel_sol' && app.duelSol.fromLive) || app.view === 'duel_hist_res') {
    if (!hasFocusedInputInRoot()) render();
  }
}

function listenDuelRoom(code) {
  stopDuelRoomStream();
  if (!FIREBASE_DB_URL || !code) return;
  if (typeof EventSource === 'function' && (typeof window === 'undefined' || !window.__DISABLE_TIMERS)) {
    try {
      const es = new EventSource(fbUrl('rooms/' + code));
      app.duel.es = es;
      es.addEventListener('put', (e) => {
        try {
          const m = JSON.parse(e.data);
          app.duel.room = setNestedAt(app.duel.room, m.path, m.data);
          onDuelRoomUpdate();
        } catch (_) {}
      });
      es.addEventListener('patch', (e) => {
        try {
          const m = JSON.parse(e.data);
          const base = m.path === '/' ? '' : m.path;
          Object.keys(m.data || {}).forEach(k => {
            app.duel.room = setNestedAt(app.duel.room, base + '/' + k, m.data[k]);
          });
          onDuelRoomUpdate();
        } catch (_) {}
      });
    } catch (_) {}
  }
  if (typeof setInterval === 'function' && (typeof window === 'undefined' || !window.__DISABLE_TIMERS)) {
    app.duel.roomPollId = setInterval(async () => {
      if (!app.duel.code) return;
      const snap = await fbReq('rooms/' + app.duel.code, 'GET');
      if (snap !== null || !app.duel.netOk) {
        app.duel.room = snap;
        onDuelRoomUpdate();
      }
    }, 1150);
  }
}

function applyRemoteState(data) {
  const d = app.duel;
  const opId = app.userId === 'p' ? 'm' : 'p';
  const prevOnline = d.opOnline;
  const prevPopup = hasIncomingChallenge();
  const prevInvSig = d.activeInvite ? (d.activeInvite.code + ':' + d.activeInvite.status + ':' + d.activeInvite.count) : '';

  const pres = data && data.presence ? data.presence : null;
  d.remotePresence = pres;
  const opP = pres ? pres[opId] : null;
  d.opOnline = !!(opP && opP.online !== false && typeof opP.ts === 'number' && (serverNow() - opP.ts) < 18000);

  d.activeInvite = data && data.activeInvite ? data.activeInvite : null;
  const nextInvSig = d.activeInvite ? (d.activeInvite.code + ':' + d.activeInvite.status + ':' + d.activeInvite.count) : '';

  const nextPopup = hasIncomingChallenge();
  if ((prevOnline !== d.opOnline || prevPopup !== nextPopup || prevInvSig !== nextInvSig) && !hasFocusedInputInRoot()) {
    if (app.view === 'duel' && d.stage === 'live' && !nextPopup) {
      updateLiveBattleDomOnly();
    } else {
      render();
    }
  }
}

async function syncLiveState() {
  if (!FIREBASE_DB_URL) return null;
  const [pres, inv] = await Promise.all([
    fbReq('presence', 'GET'),
    fbReq('activeInvite', 'GET')
  ]);
  applyRemoteState({ presence: pres, activeInvite: inv });
  if (app.duel.code && (typeof window !== 'undefined' && window.__DISABLE_TIMERS)) {
    const rSnap = await fbReq('rooms/' + app.duel.code, 'GET');
    if (rSnap) {
      app.duel.room = rSnap;
      onDuelRoomUpdate();
    }
  }
  return { presence: pres, activeInvite: inv };
}

function readAndSaveDuelName() {
  if (typeof document !== 'undefined') {
    const inp = document.getElementById('duelNameInp');
    if (inp && typeof inp.value === 'string' && inp.value.trim()) {
      app.duel.customName = inp.value.trim().slice(0, 16);
    }
  }
  const nm = (app.duel.customName || defaultPlayerName()).trim().slice(0, 16);
  app.duel.customName = nm;
  saveLS('tgt_gk_duel_name_' + app.userId, nm);
  return nm;
}

async function createDuelRoom(soloDirect) {
  if (app.duel.submitting) return null;
  const d = app.duel;
  const nm = readAndSaveDuelName();
  const scCounts = getDuelScopeCounts(d.scope);
  if (scCounts.unseen <= 0) {
    showToast('इस पाठ के सभी सवाल पूरे हो चुके हैं — पहले नया चक्र रीसेट करें!');
    return null;
  }
  if (typeof document !== 'undefined') {
    const cInp = document.getElementById('duelCntInp');
    if (cInp && cInp.value) {
      const raw = parseInt(cInp.value, 10);
      if (Number.isFinite(raw) && raw >= 1) {
        d.allScope = false;
        d.count = Math.min(scCounts.unseen, raw);
      }
    }
  }
  const cnt = duelEffCount();
  const qRefs = buildDuelRefs(d.scope, cnt);
  if (!qRefs.length) { showToast('इस पाठ में सवाल उपलब्ध नहीं हैं'); return null; }

  const scopeTitle = String(d.scope || '').startsWith('vault_')
    ? (d.customTitle || 'मेरे सवाल')
    : (d.scope === 'mix' ? 'सभी मिक्स सवाल' : (CHAPTER_BANK[d.scope]?.title || 'पाठ'));
  d.qRefs = qRefs;
  d.qs = resolveDuelQuestions(qRefs);
  d.count = qRefs.length;
  d.err = '';

  if (soloDirect) {
    d.soloPractice = true;
    d.code = '';
    d.room = {
      v: 2, st: 'go', round: 0, scope: d.scope, scopeTitle, count: qRefs.length, qRefs,
      p: { [duelPid()]: { name: nm, who: app.userId, role: 'host', pts: 0, k: 0, ok: 0, wr: 0, sk: 0, fin: 0, ans: {} } }
    };
    beginDuelLivePlay();
    return d.room;
  }

  d.soloPractice = false;
  d.submitting = true;
  render();

  const pid = duelPid();
  let code = '';
  for (let t = 0; t < 8; t++) {
    const c = String(1000 + Math.floor(Math.random() * 9000));
    const ex = await fbReq('rooms/' + c, 'GET');
    if (!ex || !ex.exp || ex.exp < Date.now()) { code = c; break; }
  }
  if (!code) code = String(1000 + Math.floor(Math.random() * 9000));

  const roomObj = {
    v: 2,
    code,
    exp: Date.now() + 3 * 3600 * 1000,
    st: 'wait',
    round: 0,
    scope: d.scope,
    scopeTitle,
    count: qRefs.length,
    createdAt: { '.sv': 'timestamp' },
    qRefs,
    p: {
      [pid]: { name: nm, who: app.userId, role: 'host', pts: 0, k: 0, ok: 0, wr: 0, sk: 0, fin: 0, ans: {} }
    }
  };

  const res = await fbReq('rooms/' + code, 'PUT', roomObj);
  d.submitting = false;
  if (!res) {
    d.err = 'Room नहीं बन सका — इंटरनेट चालू करें (या नीचे "अकेले प्रैक्टिस" दबाएँ)';
    render();
    return null;
  }

  await fbReq('activeInvite', 'PUT', {
    code,
    status: 'wait',
    fromPid: pid,
    fromWho: app.userId,
    fromName: nm,
    scope: d.scope,
    scopeTitle,
    count: qRefs.length,
    createdAt: { '.sv': 'timestamp' }
  });

  d.code = code;
  d.round = 0;
  d.room = res;
  d.stage = 'lobby';
  app.view = 'duel';
  listenDuelRoom(code);
  render();
  return res;
}

async function updateHostLobbySetup() {
  const d = app.duel;
  if (!d.code || !isDuelHost() || !d.room || d.room.st !== 'wait') return;
  const cnt = duelEffCount();
  const qRefs = buildDuelRefs(d.scope, cnt);
  if (!qRefs.length) return;
  const scopeTitle = String(d.scope || '').startsWith('vault_')
    ? (d.customTitle || 'मेरे सवाल')
    : (d.scope === 'mix' ? 'सभी मिक्स सवाल' : (CHAPTER_BANK[d.scope]?.title || 'पाठ'));
  d.qRefs = qRefs;
  d.qs = resolveDuelQuestions(qRefs);
  d.count = qRefs.length;
  d.room.scope = d.scope;
  d.room.scopeTitle = scopeTitle;
  d.room.count = qRefs.length;
  d.room.qRefs = qRefs;
  render();
  await fbReq('rooms/' + d.code, 'PATCH', { scope: d.scope, scopeTitle, count: qRefs.length, qRefs });
  await fbReq('activeInvite', 'PATCH', { scope: d.scope, scopeTitle, count: qRefs.length });
}

async function joinDuelRoom(explicitCode) {
  if (app.duel.submitting) return null;
  const d = app.duel;
  const nm = readAndSaveDuelName();
  let rawCode = explicitCode || '';
  if (!rawCode && typeof document !== 'undefined') {
    const cInp = document.getElementById('duelCodeInp');
    if (cInp && cInp.value) rawCode = cInp.value;
  }
  if (!rawCode) rawCode = d.prefillCode || '';
  const code = String(rawCode).replace(/\D/g, '').slice(0, 4);
  if (code.length !== 4) {
    d.err = '4 अंक का सही Room Code डालें!';
    render();
    return null;
  }

  d.err = '';
  d.submitting = true;
  render();

  const r = await fbReq('rooms/' + code, 'GET');
  d.submitting = false;
  if (!r || (r.exp && r.exp < Date.now())) {
    d.err = 'कोड ' + code + ' वाला कोई चालू Room नहीं मिला!';
    render();
    return null;
  }

  const pid = duelPid();
  const existingPlayers = Object.keys(r.p || {});
  const alreadyIn = existingPlayers.includes(pid);
  if (!alreadyIn && existingPlayers.length >= 2) {
    d.err = 'यह Room पहले से भरा हुआ है (2/2 खिलाड़ी)।';
    render();
    return null;
  }

  const qs = resolveDuelQuestions(r.qRefs);
  if (!qs.length) {
    d.err = 'इस Room का पाठ इस फ़ोन में उपलब्ध नहीं है।';
    render();
    return null;
  }

  const role = alreadyIn ? ((r.p[pid] && r.p[pid].role) || 'guest') : 'guest';
  const myPlayerObj = alreadyIn && r.p[pid]
    ? Object.assign({}, r.p[pid], { name: nm, who: app.userId })
    : { name: nm, who: app.userId, role, pts: 0, k: 0, ok: 0, wr: 0, sk: 0, fin: 0, ans: {} };

  await fbReq('rooms/' + code + '/p/' + pid, 'PUT', myPlayerObj);
  if (!r.p) r.p = {};
  r.p[pid] = myPlayerObj;

  d.soloPractice = false;
  d.code = code;
  d.prefillCode = '';
  d.scope = r.scope || 'ch01';
  d.count = r.count || qs.length;
  d.round = Number(r.round || 0);
  d.qs = qs;
  d.qRefs = r.qRefs;
  d.room = r;
  app.view = 'duel';
  listenDuelRoom(code);

  await fbReq('activeInvite', 'PATCH', { status: 'joined' });

  if (r.st === 'go') {
    beginDuelLivePlay();
  } else {
    d.stage = 'lobby';
    render();
  }
  return r;
}

async function startDuelRoom(allowSingle) {
  const d = app.duel;
  if (!d.code || !d.room) return;
  const ps = duelPlayers();
  if (!allowSingle && ps.length < 2) {
    showToast('पहले दूसरे खिलाड़ी को जुड़ने दें (या "अकेले शुरू करें" दबाएँ)');
    return;
  }
  if (ps.length < 2) d.soloPractice = true;
  await sendPresence(true);
  const goTime = Math.round(serverNow() + 3200);
  d.room.st = 'go';
  d.room.go = goTime;
  d.stage = 'count';
  render();
  runDuelCountdown();
  await fbReq('rooms/' + d.code, 'PATCH', { st: 'go', go: goTime });
  await fbReq('activeInvite', 'PATCH', { status: 'started' });
}

async function pushMyDuelProgress(isFinished) {
  const d = app.duel;
  const s = calcMyDuelStats();
  const pid = duelPid();
  const payload = {
    name: d.customName || defaultPlayerName(),
    who: app.userId,
    pts: s.pts,
    k: s.k,
    ok: s.ok,
    wr: s.wr,
    sk: s.sk,
    ans: d.myAns
  };
  if (isFinished) {
    payload.fin = 1;
    payload.ms = d.finishedMs || d.elapsedMs || 0;
  }
  if (d.room && d.room.p && d.room.p[pid]) {
    Object.assign(d.room.p[pid], payload);
  }
  if (!d.code || d.soloPractice) return;
  await fbReq('rooms/' + d.code + '/p/' + pid, 'PATCH', payload);
}

async function handleDuelPick(idx) {
  const d = app.duel;
  if (d.stage !== 'live') return;
  const q = d.qs[d.qIdx];
  if (!q) return;
  if (d.myAns[d.qIdx] !== undefined) return;
  const chosen = Number(idx);
  d.myAns[d.qIdx] = chosen;
  markDuelQuestionSeen(q);
  const cid = q._chId || (CHAPTER_BANK[d.scope] ? d.scope : '');
  if (cid && CHAPTER_BANK[cid]) {
    const prog = getChProg(cid);
    if (chosen === q.ans) {
      delete prog.duelWrongs[q.id];
      delete prog.duelSkips[q.id];
      if (prog.answers[q.id] !== undefined && prog.answers[q.id] >= 0 && prog.answers[q.id] !== q.ans) {
        prog.answers[q.id] = chosen;
      }
    } else {
      prog.duelWrongs[q.id] = chosen;
      delete prog.duelSkips[q.id];
    }
  }
  saveUserData(app.userId, app.userData);
  render();
  await pushMyDuelProgress(false);
}

async function handleDuelSkip() {
  const d = app.duel;
  if (d.stage !== 'live') return;
  const q = d.qs[d.qIdx];
  if (!q) return;
  if (d.myAns[d.qIdx] !== undefined) return;
  d.myAns[d.qIdx] = -1;
  markDuelQuestionSeen(q);
  const cid = q._chId || (CHAPTER_BANK[d.scope] ? d.scope : '');
  if (cid && CHAPTER_BANK[cid]) {
    getChProg(cid).duelSkips[q.id] = 1;
  }
  saveUserData(app.userId, app.userData);
  showToast('⏭ नहीं आता (0 निगेटिव अंक) · नीचे सही उत्तर व व्याख्या देखें');
  await pushMyDuelProgress(false);
}

function stepDuel(delta, viaSwipe) {
  const d = app.duel;
  if (d.stage !== 'live') return;
  const nxt = d.qIdx + delta;
  if (nxt < 0) { showToast('यह पहला सवाल है'); return; }
  if (nxt >= d.qs.length) {
    showToast('यह आख़िरी सवाल है — "परिणाम देखें" दबाएँ');
    return;
  }
  d.qIdx = nxt;
  if (viaSwipe) {
    showToast(delta > 0 ? '👉 सवाल #' + (nxt + 1) : '👈 सवाल #' + (nxt + 1));
  } else {
    render();
  }
}

async function finishDuelRun() {
  const d = app.duel;
  stopDuelTimer();
  d.elapsedMs = Math.max(100, Date.now() - (d.startedAt || Date.now()));
  d.finishedMs = d.elapsedMs;
  d.fin = 1;
  d.palOpen = false;
  d.leaveOpen = false;
  d.finishConfirmOpen = false;
  if (Array.isArray(d.qs)) {
    d.qs.forEach(markDuelQuestionSeen);
  }
  d.stage = 'result';
  upsertDuelHistoryFromCurrent();
  render();
  await pushMyDuelProgress(true);
}

async function rematchDuelRoom() {
  const d = app.duel;
  const scCounts = getDuelScopeCounts(d.scope);
  if (scCounts.unseen <= 0) {
    showToast('इस पाठ के सभी सवाल पूरे हो चुके हैं — नया चक्र रीसेट करें!');
    return;
  }
  const cnt = Math.max(1, Math.min(scCounts.unseen, d.allScope ? scCounts.unseen : (Number(d.count) || 30)));
  const qRefs = buildDuelRefs(d.scope, cnt);
  if (!qRefs.length) {
    showToast('बचे हुए सवाल नहीं मिले — नया चक्र रीसेट करें!');
    return;
  }
  const scopeTitle = String(d.scope || '').startsWith('vault_')
    ? (d.customTitle || 'मेरे सवाल')
    : (d.scope === 'mix' ? 'सभी मिक्स सवाल' : (CHAPTER_BANK[d.scope]?.title || 'पाठ'));
  if (d.soloPractice || !d.code) {
    const nextSoloRound = Number(d.round || 0) + 1;
    d.round = nextSoloRound;
    d.qRefs = qRefs;
    d.qs = resolveDuelQuestions(qRefs);
    d.room = {
      v: 2, st: 'go', round: nextSoloRound, scope: d.scope, scopeTitle, count: qRefs.length, qRefs,
      p: { [duelPid()]: { name: d.customName || defaultPlayerName(), who: app.userId, role: 'host', pts: 0, k: 0, ok: 0, wr: 0, sk: 0, fin: 0, ans: {} } }
    };
    beginDuelLivePlay();
    return;
  }
  const nextRound = Number((d.room && d.room.round) || 0) + 1;
  const upd = {
    st: 'wait',
    round: nextRound,
    go: null,
    scope: d.scope,
    scopeTitle,
    count: qRefs.length,
    qRefs
  };
  const myPid = duelPid();
  duelPlayers().forEach(p => {
    const newRole = (p.id === myPid ? 'host' : 'guest');
    upd['p/' + p.id + '/role'] = newRole;
    upd['p/' + p.id + '/pts'] = 0;
    upd['p/' + p.id + '/k'] = 0;
    upd['p/' + p.id + '/ok'] = 0;
    upd['p/' + p.id + '/wr'] = 0;
    upd['p/' + p.id + '/sk'] = 0;
    upd['p/' + p.id + '/fin'] = 0;
    upd['p/' + p.id + '/ms'] = null;
    upd['p/' + p.id + '/ans'] = null;
    if (d.room && d.room.p && d.room.p[p.id]) {
      d.room.p[p.id].role = newRole;
    }
  });
  d.round = nextRound;
  d.qRefs = qRefs;
  d.qs = resolveDuelQuestions(qRefs);
  d.myAns = {};
  d.fin = 0;
  d.stage = 'lobby';
  if (d.room) {
    d.room.st = 'wait';
    d.room.round = nextRound;
    d.room.qRefs = qRefs;
    d.room.count = qRefs.length;
  }
  render();
  await fbReq('rooms/' + d.code, 'PATCH', upd);
}

async function leaveDuelRoom(goHome) {
  const d = app.duel;
  const code = d.code;
  const pid = duelPid();
  const host = isDuelHost();
  stopDuelTimer();
  stopDuelRoomStream();
  d.code = '';
  d.room = null;
  d.soloPractice = false;
  d.leaveOpen = false;
  d.finishConfirmOpen = false;
  d.palOpen = false;
  d.stage = 'menu';
  d.err = '';
  if (goHome) app.view = 'home';
  render();
  if (code) {
    if (host) {
      await fbReq('rooms/' + code, 'DELETE');
      if (d.activeInvite && d.activeInvite.code === code) {
        await fbReq('activeInvite', 'PATCH', { status: 'closed' });
      }
    } else {
      await fbReq('rooms/' + code + '/p/' + pid, 'DELETE');
    }
  }
}

function duelVerdict(myS, myMs, opP, isFinal) {
  if (!opP) return ['⚡ अभ्यास पूरा! (' + myS.pts + ' अंक)', 'win'];
  const n = Math.max(1, app.duel.qs.length || 30);
  if (!isFinal) return ['⏳ ' + (opP.name || 'दोस्त') + ' अभी खेल रही हैं… (' + (opP.k || 0) + '/' + n + ')', 'wait'];
  const mp = Number(myS.pts || 0), op = Number(opP.pts || 0);
  const myNm = app.duel.customName || defaultPlayerName();
  const opNm = opP.name || 'दोस्त';
  if (mp !== op) return mp > op ? ['🏆 ' + myNm + ' जीतीं!', 'win'] : ['🏆 ' + opNm + ' जीतीं — अगली बार पक्का! 💪', 'lose'];
  if (myMs && opP.ms && myMs !== opP.ms) {
    return myMs < opP.ms ? ['🏆 बराबर अंक — कम समय से ' + myNm + ' जीतीं!', 'win'] : ['🏆 बराबर अंक — कम समय से ' + opNm + ' जीतीं!', 'lose'];
  }
  return ['🤝 बराबरी का शानदार मुक़ाबला!', 'draw'];
}

function getDuelSolFilteredList(rec, qs, filterKey) {
  const meAns = (rec && rec.me && rec.me.ans) || {};
  const out = [];
  qs.forEach((q, k) => {
    const p = ansOfMap(meAns, k);
    const cid = q._chId || (rec && rec.scope) || 'ch01';
    const isS = !!(CHAPTER_BANK[cid] && getChProg(cid).stars[q.id]);
    if (filterKey === 'wrong') {
      if (p !== undefined && p >= 0 && p !== q.ans) out.push(k);
    } else if (filterKey === 'skip') {
      if (p === undefined || p === -1) out.push(k);
    } else if (filterKey === 'star') {
      if (isS) out.push(k);
    } else {
      out.push(k);
    }
  });
  return out;
}

function stepDuelSol(delta, viaSwipe) {
  const s = app.duelSol;
  const rec = getDuelRecordById(s.matchId);
  if (!rec) return;
  const qs = resolveDuelQuestions(rec.qRefs);
  const list = getDuelSolFilteredList(rec, qs, s.filter);
  if (!list.length) return;
  const pos = list.indexOf(s.idx);
  const nxtPos = (pos < 0 ? 0 : pos) + delta;
  if (nxtPos < 0) { showToast('यह इस फ़िल्टर का पहला सवाल है'); return; }
  if (nxtPos >= list.length) { showToast('यह आख़िरी सवाल है'); return; }
  s.idx = list[nxtPos];
  if (viaSwipe) {
    showToast(delta > 0 ? '👉 सवाल #' + (s.idx + 1) : '👈 सवाल #' + (s.idx + 1));
  } else {
    render();
  }
}

function syncBackHistoryGuard() {
  if (typeof window === 'undefined' || window.__DISABLE_TIMERS || !window.history || typeof window.history.pushState !== 'function') return;
  const needsGuard = app.view !== 'home' && app.view !== 'welcome';
  if (needsGuard && !app._backArmed) {
    try {
      window.history.pushState({ tgtNavGuard: 1 }, '');
      app._backArmed = true;
    } catch (_) {}
  }
}

function handleBackNavigation() {
  if (app.view === 'quiz') {
    if (app.quiz.palOpen) { app.quiz.palOpen = false; render(); return true; }
    if (app.quiz.zoomOpen) { app.quiz.zoomOpen = false; render(); return true; }
    app.view = app.quiz.isVault ? 'vault' : 'home';
    render();
    return true;
  }
  if (app.view === 'result') {
    app.view = 'quiz';
    render();
    return true;
  }
  if (app.view === 'vault') {
    if (app.vault.zoomOpen) { app.vault.zoomOpen = false; render(); return true; }
    app.view = 'home';
    render();
    return true;
  }
  if (app.view === 'duel_sol') {
    if (app.duelSol.zoomOpen) { app.duelSol.zoomOpen = false; render(); return true; }
    if (app.duelSol.fromLive && app.duel.stage === 'result') app.view = 'duel';
    else { app.duelHist.activeId = app.duelSol.matchId; app.view = 'duel_hist_res'; }
    render();
    return true;
  }
  if (app.view === 'duel_hist_res') {
    if (app.duel.zoomOpen) { app.duel.zoomOpen = false; render(); return true; }
    app.view = 'duel_hist';
    render();
    return true;
  }
  if (app.view === 'duel_hist') {
    app.view = 'home';
    render();
    return true;
  }
  if (app.view === 'duel') {
    if (app.duel.palOpen) { app.duel.palOpen = false; render(); return true; }
    if (app.duel.finishConfirmOpen) { app.duel.finishConfirmOpen = false; render(); return true; }
    if (app.duel.leaveOpen) { app.duel.leaveOpen = false; render(); return true; }
    if (app.duel.zoomOpen) { app.duel.zoomOpen = false; render(); return true; }
    if (app.duel.stage === 'live') { app.duel.leaveOpen = true; render(); return true; }
    if (app.duel.stage === 'lobby') { leaveDuelRoom(false); return true; }
    if (app.duel.stage === 'result') { leaveDuelRoom(true); return true; }
    app.view = 'home';
    render();
    return true;
  }
  return false;
}

function render() {
  const root = document.getElementById('appRoot');
  if (!root) return '';
  const oldBody = root.querySelector ? root.querySelector('.body-scr') : null;
  const oldHome = root.querySelector ? root.querySelector('.cm-scroll') : null;
  const prevBodyTop = oldBody ? oldBody.scrollTop : 0;
  const prevHomeTop = oldHome ? oldHome.scrollTop : 0;

  let renderKey = app.view;
  if (app.view === 'quiz') {
    renderKey = 'quiz:' + (app.quiz.isVault ? 'vault' : app.quiz.chId) + ':' + app.quiz.cur;
  } else if (app.view === 'home') {
    renderKey = 'home:' + app.userData.tabId;
  } else if (app.view === 'vault') {
    renderKey = 'vault:' + app.vault.tab + ':' + app.vault.chFilter;
  } else if (app.view === 'duel') {
    renderKey = 'duel:' + app.duel.stage + ':' + app.duel.qIdx;
  } else if (app.view === 'duel_hist') {
    renderKey = 'duel_hist';
  } else if (app.view === 'duel_hist_res') {
    renderKey = 'duel_hist_res:' + app.duelHist.activeId;
  } else if (app.view === 'duel_sol') {
    renderKey = 'duel_sol:' + app.duelSol.matchId + ':' + app.duelSol.filter + ':' + app.duelSol.idx;
  }

  let html = '';
  if (app.view === 'welcome') html = renderWelcomeView();
  else if (app.view === 'home') html = renderHomeView();
  else if (app.view === 'vault') html = renderVaultView();
  else if (app.view === 'quiz') html = renderQuizView();
  else if (app.view === 'result') html = renderResultView();
  else if (app.view === 'duel_hist') html = renderDuelHistListView();
  else if (app.view === 'duel_hist_res') html = renderDuelHistResView();
  else if (app.view === 'duel_sol') html = renderDuelSolView();
  else html = renderDuelView();
  const popupHtml = hasIncomingChallenge() ? renderIncomingModal(app.duel.activeInvite) : '';
  root.innerHTML = html + popupHtml;
  renderToastDom();

  const newBody = root.querySelector ? root.querySelector('.body-scr') : null;
  const newHome = root.querySelector ? root.querySelector('.cm-scroll') : null;
  if (renderKey === app._lastRenderKey) {
    if (newBody) newBody.scrollTop = prevBodyTop;
    if (newHome) newHome.scrollTop = prevHomeTop;
  } else {
    if (newBody) newBody.scrollTop = 0;
  }
  app._lastRenderKey = renderKey;
  syncBackHistoryGuard();

  if ((app.view === 'quiz' || app.view === 'duel_sol' || (app.view === 'duel' && app.duel.stage === 'live')) && root.querySelector) {
    const strip = root.querySelector('.q-strip');
    const active = strip && strip.querySelector ? strip.querySelector('.q-num.cur') : null;
    if (strip && active && typeof active.offsetLeft === 'number') {
      strip.scrollLeft = Math.max(0, active.offsetLeft - (strip.clientWidth || 0) / 2 + (active.offsetWidth || 0) / 2);
    }
  }
  return root.innerHTML;
}

function openChapter(chId, mode) {
  const ch = CHAPTER_BANK[chId];
  if (!ch) return;
  const prog = getChProg(chId);
  if (mode === 'reset') {
    prog.answers = {};
    prog.finished = false;
    prog.curIdx = 0;
    saveUserData(app.userId, app.userData);
    mode = 'full';
    showToast('🔄 नया चक्र शुरू: सभी ' + ch.total_questions + ' सवाल फिर से खुले!');
  }
  let ids = [];
  if (mode === 'wrong') {
    ids = ch.questions.filter(q => (prog.answers[q.id] !== undefined && prog.answers[q.id] >= 0 && prog.answers[q.id] !== q.ans) || (prog.duelWrongs && prog.duelWrongs[q.id] !== undefined)).map(q => q.id);
  } else if (mode === 'skip') {
    ids = ch.questions.filter(q => prog.answers[q.id] === -1 || prog.answers[q.id] === undefined).map(q => q.id);
  } else if (mode === 'star') {
    ids = ch.questions.filter(q => prog.stars && prog.stars[q.id]).map(q => q.id);
  } else if (mode === 'resume') {
    const ansCnt = Object.keys(prog.answers || {}).length;
    const unseenIds = ch.questions.filter(q => prog.answers[q.id] === undefined).map(q => q.id);
    if (ansCnt > 0 && unseenIds.length > 0) {
      ids = unseenIds;
    } else {
      ids = ch.questions.map(q => q.id);
    }
  }
  if (!ids.length) {
    if (mode === 'wrong' || mode === 'star' || mode === 'skip') {
      showToast(mode === 'wrong' ? 'कोई गलत सवाल बाकी नहीं!' : (mode === 'skip' ? 'कोई छोड़ा गया सवाल बाकी नहीं!' : 'अभी कोई स्टार सवाल नहीं है!'));
      return;
    }
    ids = ch.questions.map(q => q.id);
  }
  const useSess = (mode === 'wrong' || mode === 'star' || mode === 'skip');
  app.userData.lastChId = chId;
  saveUserData(app.userId, app.userData);
  app.quiz = {
    chId,
    title: ch.title,
    mode,
    isVault: false,
    useSessionAns: useSess,
    sessionAns: {},
    vaultRefs: [],
    vaultAns: {},
    qIds: ids,
    cur: 0,
    palOpen: false,
    palFilter: 'all',
    zoomOpen: false,
    showQInSol: false,
    showOther: false
  };
  app.view = 'quiz';
  render();
}

function stepQuiz(delta, viaSwipe) {
  const len = getQuizLength();
  const nxt = app.quiz.cur + delta;
  if (nxt < 0) { showToast('यह पहला सवाल है'); return; }
  if (nxt >= len) {
    showToast('यह आख़िरी सवाल है — नीचे "परिणाम देखें" दबाएँ');
    return;
  }
  app.quiz.cur = nxt;
  app.quiz.showQInSol = false;
  if (!app.quiz.isVault && CHAPTER_BANK[app.quiz.chId]) {
    getChProg(app.quiz.chId).curIdx = nxt;
    saveUserData(app.userId, app.userData);
  }
  if (viaSwipe) {
    showToast(delta > 0 ? '👉 स्वाइप: अगला सवाल #' + (nxt + 1) : '👈 स्वाइप: पिछला सवाल #' + (nxt + 1));
  } else {
    render();
  }
}

function openWaUrl(msg) {
  try {
    if (typeof window !== 'undefined' && window.open && !window.__DISABLE_POPUPS) {
      window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
    }
  } catch (_) {}
  showToast('📲 WhatsApp तैयार: ' + msg);
}

function handleAction(el, ev) {
  const act = el.getAttribute('data-act');
  if (!act) return;

  if (act === 'choose-user') {
    app.userId = el.getAttribute('data-u') === 'p' ? 'p' : 'm';
    saveLS('tgt_gk_active_user_v1', app.userId);
    app.userData = loadUserData(app.userId);
    app.zoomPct = loadGlobalZoom();
    app.userData.zoomPct = app.zoomPct;
    app.duel.customName = defaultPlayerName();
    app.view = app.duel.prefillCode ? 'duel' : 'home';
    render();
    sendPresence(true);
    syncLiveState();
    return;
  }
  if (act === 'open-welcome') {
    sendPresence(false, true);
    stopDuelTimer();
    app.view = 'welcome';
    render(); return;
  }
  if (act === 'back-home') {
    stopDuelTimer();
    app.view = 'home';
    render(); return;
  }
  if (act === 'sel-sub') { app.userData.tabId = el.getAttribute('data-v'); saveUserData(app.userId, app.userData); render(); return; }
  if (act === 'tog-ready') { app.userData.onlyReady = !app.userData.onlyReady; saveUserData(app.userId, app.userData); render(); return; }
  if (act === 'tog-paper') { app.userData.paperTint = !app.userData.paperTint; saveUserData(app.userId, app.userData); render(); return; }
  if (act === 'tog-twig') { const cid = el.getAttribute('data-cid'); app.doneTwigCh = app.doneTwigCh === cid ? '' : cid; render(); return; }
  if (act === 'soon-ch') { showToast('📚 "' + el.getAttribute('data-t') + '" जल्द जुड़ेगा!'); return; }
  if (act === 'open-ch') { openChapter(el.getAttribute('data-cid'), el.getAttribute('data-mode') || 'full'); return; }
  if (act === 'trigger-import') { const inp = document.getElementById('jsonImportInput'); if (inp && inp.click) inp.click(); return; }

  // Unified D1 Vault actions (★ स्टार · ✗ गलत · ⏭ छोड़े)
  if (act === 'open-vault') {
    app.vault.tab = el.getAttribute('data-v') || 'star';
    app.vault.chFilter = 'all';
    app.vault.cardPicks = {};
    app.view = 'vault';
    render(); return;
  }
  if (act === 'open-vault-back') {
    app.view = 'vault';
    render(); return;
  }
  if (act === 'v-tab') { app.vault.tab = el.getAttribute('data-v') || 'star'; app.vault.chFilter = 'all'; app.vault.cardPicks = {}; render(); return; }
  if (act === 'v-ch') { app.vault.chFilter = el.getAttribute('data-v') || 'all'; render(); return; }
  if (act === 'v-ztog') { app.vault.zoomOpen = !app.vault.zoomOpen; render(); return; }
  if (act === 'v-pick') {
    const k = el.getAttribute('data-k');
    const oi = Number(el.getAttribute('data-i'));
    if (!k || !Number.isFinite(oi)) return;
    if (app.vault.cardPicks[k] !== undefined) return;
    app.vault.cardPicks[k] = oi;
    render(); return;
  }
  if (act === 'v-retry-card') {
    const k = el.getAttribute('data-k');
    if (k) {
      delete app.vault.cardPicks[k];
      delete app.vault.openAns[k];
    }
    render(); return;
  }
  if (act === 'v-tog-ans') {
    const k = el.getAttribute('data-k');
    app.vault.openAns[k] = !app.vault.openAns[k];
    render(); return;
  }
  if (act === 'v-star') {
    const cid = el.getAttribute('data-cid');
    const qid = Number(el.getAttribute('data-qid'));
    if (CHAPTER_BANK[cid]) {
      const prog = getChProg(cid);
      prog.stars[qid] = !prog.stars[qid];
      saveUserData(app.userId, app.userData);
      showToast(prog.stars[qid] ? '★ स्टार में सहेजा गया' : '☆ स्टार हटाया गया');
    }
    return;
  }
  if (act === 'v-clear-wr') {
    const cid = el.getAttribute('data-cid');
    const qid = Number(el.getAttribute('data-qid'));
    const ch = CHAPTER_BANK[cid];
    const q = ch ? ch.questions.find(x => x.id === qid) : null;
    if (ch && q) {
      const prog = getChProg(cid);
      delete prog.duelWrongs[qid];
      if (prog.answers[qid] !== undefined && prog.answers[qid] !== q.ans) prog.answers[qid] = q.ans;
      saveUserData(app.userId, app.userData);
      showToast('✅ यह सवाल "गलत" सूची से हटा दिया गया!');
    }
    return;
  }
  if (act === 'v-speak') {
    const cid = el.getAttribute('data-cid');
    const qid = Number(el.getAttribute('data-qid'));
    const ch = CHAPTER_BANK[cid];
    const q = ch ? ch.questions.find(x => x.id === qid) : null;
    if (q) speakHindi('सही उत्तर: ' + q.opts[q.ans] + '। ' + splitReadablePoints(q.exp).join(' '));
    return;
  }
  if (act === 'v-solve') { openVaultQuiz(app.vault.tab, app.vault.chFilter); return; }
  if (act === 'v-duel') { launchVaultDuel(app.vault.tab, app.vault.chFilter); return; }

  // Quiz actions (supports both Chapter Quiz & Multi-Chapter Vault Quiz)
  if (act === 'q-pick') {
    if (getQuizPicked(app.quiz.cur) !== undefined) return;
    const chosen = Number(el.getAttribute('data-i'));
    const it = getQuizItem(app.quiz.cur);
    if (!it) return;
    const prog = getChProg(it.chId);
    if (app.quiz.isVault) {
      app.quiz.vaultAns[app.quiz.cur] = chosen;
      if (chosen === it.q.ans) {
        delete prog.duelWrongs[it.q.id];
        delete prog.duelSkips[it.q.id];
        if (prog.answers[it.q.id] !== undefined && prog.answers[it.q.id] !== it.q.ans) prog.answers[it.q.id] = chosen;
      } else {
        prog.duelWrongs[it.q.id] = chosen;
      }
    } else if (app.quiz.useSessionAns) {
      app.quiz.sessionAns[app.quiz.cur] = chosen;
      prog.answers[it.q.id] = chosen;
      if (chosen === it.q.ans) {
        delete prog.duelWrongs[it.q.id];
        delete prog.duelSkips[it.q.id];
      } else {
        prog.duelWrongs[it.q.id] = chosen;
        delete prog.duelSkips[it.q.id];
      }
    } else {
      prog.answers[it.q.id] = chosen;
      prog.curIdx = app.quiz.cur;
      if (chosen === it.q.ans) {
        delete prog.duelWrongs[it.q.id];
        delete prog.duelSkips[it.q.id];
      } else {
        delete prog.duelSkips[it.q.id];
      }
    }
    saveUserData(app.userId, app.userData);
    app.quiz.showQInSol = false;
    render(); return;
  }
  if (act === 'q-skip') {
    const it = getQuizItem(app.quiz.cur);
    if (!it) return;
    const prog = getChProg(it.chId);
    if (app.quiz.isVault) {
      app.quiz.vaultAns[app.quiz.cur] = -1;
    } else if (app.quiz.useSessionAns) {
      app.quiz.sessionAns[app.quiz.cur] = -1;
    } else {
      prog.answers[it.q.id] = -1;
      prog.curIdx = app.quiz.cur;
      saveUserData(app.userId, app.userData);
    }
    app.quiz.showQInSol = false;
    showToast('⏭ नहीं आता (0 निगेटिव अंक) · नीचे सही उत्तर देखें');
    return;
  }
  if (act === 'q-retry') {
    const it = getQuizItem(app.quiz.cur);
    if (!it) return;
    if (app.quiz.isVault) {
      delete app.quiz.vaultAns[app.quiz.cur];
    } else if (app.quiz.useSessionAns) {
      delete app.quiz.sessionAns[app.quiz.cur];
    } else {
      const prog = getChProg(it.chId);
      delete prog.answers[it.q.id];
      saveUserData(app.userId, app.userData);
    }
    app.quiz.showQInSol = false;
    render(); return;
  }
  if (act === 'q-step') {
    stepQuiz(Number(el.getAttribute('data-d')) || 1, false);
    return;
  }
  if (act === 'q-jump') {
    const nxt = Number(el.getAttribute('data-i')) || 0;
    app.quiz.cur = nxt; app.quiz.palOpen = false; app.quiz.showQInSol = false;
    if (!app.quiz.isVault && CHAPTER_BANK[app.quiz.chId]) {
      getChProg(app.quiz.chId).curIdx = nxt;
      saveUserData(app.userId, app.userData);
    }
    render(); return;
  }
  if (act === 'q-pal-tog' || act === 'q-pal-bg') {
    if (act === 'q-pal-bg' && ev && ev.target && ev.target !== el) return;
    app.quiz.palOpen = !app.quiz.palOpen; render(); return;
  }
  if (act === 'q-pal-f') { app.quiz.palFilter = el.getAttribute('data-v'); render(); return; }

function startLiveSyncLoop() {
  if (!FIREBASE_DB_URL || typeof window === 'undefined' || window.__DISABLE_TIMERS) return;
  if (typeof setInterval === 'function') {
    setInterval(() => {
      if (typeof document === 'undefined' || document.visibilityState !== 'hidden') sendPresence(true);
    }, 6000);
  }
  const stepPoll = async () => {
    await syncLiveState();
    const fast = app.duel.stage === 'lobby' || app.duel.stage === 'result';
    if (typeof setTimeout === 'function') setTimeout(stepPoll, fast ? 1400 : 3000);
  };

  if (typeof document !== 'undefined' && document.addEventListener) {
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') sendPresence(false, true);
      else { sendPresence(true); syncLiveState(); }

  }
  if (window.addEventListener) {
    window.addEventListener('pagehide', () => sendPresence(false, true));
  }
}

function bindQuizSwipe() {
  const root = document.getElementById('appRoot');
  if (!root || !root.addEventListener) return;
  let sx = 0, sy = 0, st = 0, tracking = false;
  const canSwipeNow = () => {
    if (hasIncomingChallenge()) return false;
    if (app.view === 'quiz' && !app.quiz.palOpen) return true;
    if (app.view === 'duel_sol') return true;
    if (app.view === 'duel' && app.duel.stage === 'live' && !app.duel.palOpen && !app.duel.leaveOpen && !app.duel.finishConfirmOpen) return true;
    return false;
  };
  root.addEventListener('touchstart', (e) => {
    if (!canSwipeNow()) { tracking = false; return; }
    const tgt = e.target;
    if (tgt && tgt.closest && tgt.closest('.q-strip, .sv-tabs-bar, .zoom-bar, .sheet-bg, .modal-bg, .mtab, .battle')) { tracking = false; return; }
    const touches = e.touches || e.changedTouches;
    if (touches && touches.length !== 1) { tracking = false; return; }
    const t = touches ? touches[0] : null;
    if (!t) { tracking = false; return; }
    sx = t.clientX; sy = t.clientY; st = Date.now(); tracking = true;
  }, { passive: true });
  root.addEventListener('touchend', (e) => {
    if (!tracking) return;
    tracking = false;
    if (!canSwipeNow()) return;
    const t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    const dx = t.clientX - sx, dy = t.clientY - sy, dt = Date.now() - st;
    if (Math.abs(dx) >= 55 && Math.abs(dx) > Math.abs(dy) * 1.45 && dt <= 750) {
      if (app.view === 'duel') stepDuel(dx < 0 ? 1 : -1, true);
      else if (app.view === 'duel_sol') stepDuelSol(dx < 0 ? 1 : -1, true);
      else stepQuiz(dx < 0 ? 1 : -1, true);
    }
  }, { passive: true });
}
